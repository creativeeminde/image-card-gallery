<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shelved. — Your Reading Companion</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/700.css">
<style>
  :root{
    --paper:#f7f1e6; --card:#fffdf8; --ink:#211a14; --ink2:#71655a; --line:#e7dccb;
    --accent:#e4572e; --accent2:#c2410c; --accent-soft:#fdeae2;
    --green:#2e9e63; --green-soft:#e2f4e9;
    --gold:#d99a2b; --gold-soft:#f8ecd7;
    --dark:#241c14; --r:18px;
    --f-ui:'Manrope',system-ui,sans-serif; --f-disp:'Fraunces',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--f-ui); color:var(--ink);
    background:#171310;
    background-image:radial-gradient(60% 50% at 15% 10%, rgba(228,87,46,.16), transparent 60%),
                     radial-gradient(50% 45% at 90% 90%, rgba(46,158,99,.12), transparent 60%);
    display:grid; place-items:center; min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea{font-family:inherit}
  img{user-select:none}

  .phone{position:relative;width:min(430px,100%);height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:480px){
    .phone{height:min(900px,calc(100dvh - 56px));border-radius:38px;box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.09)}
  }
  .screen{flex:1;overflow-y:auto;padding:22px 20px 108px;overscroll-behavior:contain}
  .screen::-webkit-scrollbar{width:0}
  .view{animation:rise .3s ease}

  /* ---------- type ---------- */
  .brand{font-family:var(--f-disp);font-weight:700;font-size:27px;letter-spacing:-.01em}
  .brand em{color:var(--accent);font-style:normal}
  .pg-title{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:-.01em}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
  .sec h2{font-family:var(--f-disp);font-weight:600;font-size:18px}
  .sec .count{font-size:12px;font-weight:700;color:var(--ink2)}
  .link{border:none;background:none;color:var(--accent2);font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
  .sub-date{font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:2px}

  /* ---------- buttons / chips ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:800;font-size:14px;padding:12px 18px;border:none;transition:transform .15s, box-shadow .15s, background .15s}
  .btn:active{transform:scale(.96)}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(228,87,46,.35)}
  .btn-soft{background:var(--accent-soft);color:var(--accent2)}
  .btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
  .btn-danger{background:#fdecec;color:#c0392b}
  .btn-sm{padding:9px 14px;font-size:12.5px}
  .btn.full{width:100%}
  .icon-btn{width:38px;height:38px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn.mini{width:28px;height:28px;border:none;background:#efe6d7;color:var(--ink2)}
  .icon-btn.mini svg{width:13px;height:13px}
  .chip{padding:10px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
  .chip:active{transform:scale(.95)}
  .chip svg{width:13px;height:13px}
  .chip.tiny{padding:5px 10px;font-size:10.5px;border:none;background:#efe6d7}

  .pill{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.reading{background:var(--accent-soft);color:var(--accent2)}
  .pill.later{background:var(--gold-soft);color:#a06b12}
  .pill.finished{background:var(--green-soft);color:#1d7a4a}
  .pill.none{background:#eee7da;color:#9a8d7d}

  /* ---------- covers ---------- */
  .cover{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(140deg,#e8dcc8,#d3c3a6);box-shadow:0 5px 14px rgba(30,20,10,.2);flex-shrink:0}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .lib-badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2px solid rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:2}
  .lib-badge svg{width:10px;height:10px}
  .lib-badge.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}

  /* ---------- cards & rows ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .dark-card{background:linear-gradient(135deg,#2c2115,#1c150d);color:#f5ead9;border:none;box-shadow:0 14px 30px rgba(20,12,4,.35)}
  .hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 12px;margin:0 -20px;scroll-snap-type:x proximity}
  .hscroll::-webkit-scrollbar{display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px}
  .gcard{cursor:pointer;scroll-snap-align:start}
  .hscroll .gcard{width:112px;flex-shrink:0}
  .gcard .cover{transition:transform .2s}
  .gcard:active .cover{transform:scale(.96)}
  .gcard .t{font-weight:800;font-size:13px;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;overflow:hidden}
  .gcard .a{color:var(--ink2);font-size:11.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:16px;cursor:pointer;transition:background .15s}
  .row:hover{background:rgba(255,255,255,.75)}
  .row .info{flex:1;min-width:0}
  .row .t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .a{color:var(--ink2);font-size:12px;font-weight:600;margin-top:1px}

  .rcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;width:262px;flex-shrink:0;scroll-snap-align:start;cursor:pointer;transition:transform .15s}
  .rcard:active{transform:scale(.97)}
  .rc-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .rc-t{font-weight:800;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;overflow:hidden}
  .rc-a{color:var(--ink2);font-size:11.5px;font-weight:600}
  .rc-m{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--ink2)}
  .rc-up{color:var(--accent2)}

  .pbar{height:6px;border-radius:99px;background:#eee3d2;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .5s ease}

  /* ---------- header bars ---------- */
  .headbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .headbar .hb-t{font-family:var(--f-disp);font-weight:700;font-size:21px}
  .headbar .hb-s{font-size:12px;font-weight:700;color:var(--ink2);margin-top:1px}
  .headbar .spacer{flex:1}

  /* ---------- search ---------- */
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:6px}
  .searchbar svg{width:17px;height:17px;color:var(--ink2);flex-shrink:0}
  .searchbar input{border:none;outline:none;background:transparent;flex:1;font-weight:700;font-size:14px;color:var(--ink);min-width:0}
  .searchbar input::placeholder{color:#b3a globals}
  .searchbar input::placeholder{color:#b3a691;font-weight:600}

  /* ---------- segmented ---------- */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#efe6d7;padding:5px;border-radius:14px}
  .seg button,.seg label{border:none;background:transparent;padding:10px 4px;border-radius:10px;font-weight:800;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;transition:.18s;cursor:pointer}
  .seg button svg,.seg label svg{width:14px;height:14px}
  .seg button.on,.seg label.on{background:var(--ink);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.22)}
  .seg.two{grid-template-columns:1fr 1fr}
  .seg input[type=radio]{display:none}
  .filter-seg{margin-bottom:14px}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat-n{font-family:var(--f-disp);font-weight:700;font-size:30px}
  .stat-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:2px}
  .bar-row{margin-top:12px}
  .bar-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:5px}
  .bar-h span:last-child{color:var(--ink2)}
  .bar-track{height:8px;border-radius:99px;background:#efe6d7;overflow:hidden}
  .bar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .6s ease}
  .bar-track i.green{background:linear-gradient(90deg,#5cb98a,var(--green))}

  /* ---------- challenge ---------- */
  .chal{display:flex;align-items:center;gap:16px;padding:18px}
  .chal .ring{width:74px;height:74px;flex-shrink:0}
  .chal .ring circle{fill:none;stroke-width:7}
  .chal .c1{stroke:rgba(255,255,255,.14)}
  .chal .c2{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .7s ease}
  .chal h3{font-family:var(--f-disp);font-size:17px;font-weight:700}
  .chal p{font-size:12.5px;font-weight:700;color:#cbb astro}
  .chal p{color:#cbb59a;margin-top:3px}
  .chal .btn{margin-top:10px}

  /* ---------- lists ---------- */
  .list-card{cursor:pointer;transition:transform .15s}
  .list-card:active{transform:scale(.98)}
  .lc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .lc-name{font-weight:800;font-size:15px}
  .lc-desc{color:var(--ink2);font-size:12.5px;font-weight:600;margin-top:3px}
  .lc-covers{display:flex;margin-top:12px}
  .lc-covers .cover{width:40px;border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.25);margin-right:-10px;border:2px solid var(--card)}
  .lc-covers .more{width:40px;height:60px;border-radius:7px;background:#efe6d7;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink2);margin-left:12px}

  /* ---------- empty ---------- */
  .empty{text-align:center;padding:30px 20px;border:1.5px dashed var(--line);border-radius:20px;color:var(--ink2)}
  .empty .e-ic{width:52px;height:52px;border-radius:50%;background:#efe6d7;display:grid;place-items:center;margin:0 auto 12px;color:var(--accent2)}
  .empty .e-ic svg{width:22px;height:22px}
  .empty h4{font-family:var(--f-disp);font-size:16px;color:var(--ink);margin-bottom:5px}
  .empty p{font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:14px}

  /* ---------- genre cards ---------- */
  .g-big{position:relative;border-radius:20px;overflow:hidden;padding:16px;height:118px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;margin-bottom:12px;transition:transform .15s}
  .g-big:active{transform:scale(.98)}
  .g-big h3{font-family:var(--f-disp);font-size:19px;font-weight:700}
  .g-big span{font-size:11.5px;font-weight:800;opacity:.75}
  .g-big .minis{position:absolute;top:14px;right:14px;display:flex}
  .g-big .minis .cover{width:44px;border-radius:7px;box-shadow:0 4px 10px rgba(0,0,0,.35);margin-left:-14px;transform:rotate(4deg)}
  .g-big .minis .cover:nth-child(2){transform:rotate(-3deg)}

  /* ---------- notes ---------- */
  .note-card{position:relative;margin-bottom:12px}
  .note-card .n-book{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .note-card .n-t{font-weight:800;font-size:13px}
  .note-card .n-a{font-size:11px;color:var(--ink2);font-weight:600}
  .note-card blockquote{font-family:var(--f-disp);font-size:15px;line-height:1.55;border-left:3px solid var(--gold);padding-left:12px}
  .note-card .n-date{margin-top:10px;font-size:11px;font-weight:800;color:var(--ink2)}
  .note-card .del{position:absolute;top:12px;right:12px}

  /* ---------- tabbar ---------- */
  .tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:30}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a5988a;font-size:10px;font-weight:800;letter-spacing:.03em;padding:6px 0;border:none;background:none;transition:color .2s}
  .tab svg{width:21px;height:21px;transition:transform .2s}
  .tab.on{color:var(--accent)}
  .tab.on svg{transform:translateY(-1px) scale(1.06)}

  /* ---------- modal ---------- */
  .modal-root{position:absolute;inset:0;z-index:40;pointer-events:none}
  .modal-root.open{pointer-events:auto}
  .overlay{position:absolute;inset:0;background:rgba(23,15,8,.55);backdrop-filter:blur(3px);animation:fade .25s}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:14px 20px 34px;animation:up .34s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.35)}
  .sheet::-webkit-scrollbar{width:0}
  .grabber{width:44px;height:5px;border-radius:99px;background:#d8cbb6;margin:0 auto 16px}
  .sheet-x{position:absolute;top:18px;right:18px;z-index:2}
  .bm-top{display:flex;gap:16px;margin-bottom:14px}
  .bm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .bm-t{font-family:var(--f-disp);font-weight:700;font-size:21px;line-height:1.15}
  .bm-a{color:var(--ink2);font-weight:700;font-size:13px;margin-top:4px}
  .bm-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
  .stars{display:inline-flex;gap:1px}
  .star{color:#ddd0ba;display:inline-flex}
  .star svg{width:12px;height:12px}
  .star.on{color:var(--gold)}
  .bm-blurb{font-size:13px;font-weight:600;line-height:1.6;color:var(--ink2);margin-bottom:18px}
  .bm-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
  .in-lists{font-size:11px;font-weight:700;color:var(--ink2)}

  .prog-card{margin-top:16px}
  .prog-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .prog-pct{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--accent2)}
  .prog-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .prog-row input{width:86px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;background:var(--card);outline:none;color:var(--ink)}
  .prog-row input:focus{border-color:var(--accent)}
  .prog-total{font-size:12px;font-weight:800;color:var(--ink2);flex:1}

  .field{margin-top:14px}
  .field label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;background:var(--card);outline:none;color:var(--ink);resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .pick-row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px;cursor:pointer}
  .pick-row:hover{background:rgba(255,255,255,.7)}
  .pick-row .info{flex:1;min-width:0}
  .pick-row .t{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick-row .a{font-size:11px;color:var(--ink2);font-weight:600}
  .cbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;transition:.15s;flex-shrink:0}
  .cbox svg{width:12px;height:12px;opacity:0;transition:.15s}
  .cbox.on{background:var(--green);border-color:var(--green)}
  .cbox.on svg{opacity:1}
  .divider{height:1px;background:var(--line);margin:16px 0}

  /* ---------- toast ---------- */
  .toast-root{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;z-index:60;pointer-events:none;padding:0 16px}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#241c14;color:#fdf6ea;padding:12px 18px;border-radius:999px;font-size:12.5px;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.4);animation:rise .3s;max-width:100%}
  .toast-act{background:rgba(255,255,255,.14);border:none;color:var(--gold);font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:12px}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>
</div>

<script>
/* ============================================================
   DATA
============================================================ */
const CATALOG = [
  {id:'b1', title:'The Glass Meridian', author:'T.M. Vance', genre:'Thriller', lang:'English', pages:384, rating:4.4, blurb:'A forensic architect decodes a murder hidden inside the blueprints of a fog-bound skyscraper.', cover:'https://image.qwenlm.ai/public_source/fcd5d7d0-6dbf-47f5-a3aa-79a484e08a22/156a14db9-0f67-484a-887c-bdd2032bc5e5.png'},
  {id:'b2', title:'The Hollow Key', author:'Dana Reeves', genre:'Thriller', lang:'English', pages:352, rating:4.1, blurb:'An estate lawyer inherits a key that opens every locked door in the city — except one.', cover:'https://image.qwenlm.ai/public_source/fcd5d7d0-6dbf-47f5-a3aa-79a484e08a22/1ae8ae51c-ac45-4d24-b221-96b947350504.png'},
  {id:'b3', title:'Whiteout Protocol', author:'Erik Sorensen', genre:'Thriller', lang:'Norwegian', pages:410, rating:3.9, blurb:'A polar research station goes silent, and the rescue team sent to investigate vanishes too.', cover:'https://image.qwenlm.ai/public_source/fcd5d7d0-6dbf-47f5-a3aa-79a484e08a22/18f82abaa-4a1d-45de-94f2-26b5624d8fc7.png'},

  {id:'b5', title:'The Quiet Algorithm', author:'Ade Okafor', genre:'Non-fiction', lang:'English', pages:320, rating:4.2, blurb:'How invisible systems curate your taste, your news, and your next favorite book.', cover:'https://image.qwenlm.ai/public_source/fcd5d7d0-6dbf-47f5-a3aa-79a484e08a22/1f810b9e4-ac7f-4977-bd10-e661ceb6f00a.png'},

function stars(r){
  let s='';
  for(let i=1;i<=5;i++) s += `<span class="star ${i<=Math.round(r)?'on':''}">${I.star}</span>`;
  return `<span class="stars">${s}</span>`;
}

/* Cover with the "in library" ✓ badge (top-right corner) */
function cover(b, w, badge){
  const show = badge && inLibrary(b);
  return `<div class="cover" style="width:${w}px">${show?`<span class="lib-badge ${popIds.has(b.id)?'pop':''}" title="In your library">${I.check}</span>`:''}<img loading="lazy" src="${b.cover}" alt="${esc(b.title)} cover"></div>`;
}
function gcard(b){
  return `<div class="gcard" data-action="open-book" data-id="${b.id}">${cover(b,999,true)}<div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>`;
}
function headBar(title, sub){
  return `<div class="headbar"><button class="icon-btn" data-action="back" aria-label="Back">${I.back}</button><div><div class="hb-t">${title}</div>${sub?`<div class="hb-s">${sub}</div>`:''}</div></div>`;
}

/* ============================================================

============================================================ */
function viewHTML(){
  const v = state.stack.length ? state.stack[state.stack.length-1] : {name:state.tab};
  switch(v.name){
    case 'home': return homeView();
    case 'recs': return recsView();
    case 'books': return booksView();
    case 'list': return listView(v.id);
    case 'stats': return statsView();
    case 'explore': return exploreView();
    case 'genre': return genreView(v.genre);
    case 'genres': return genresView();
    case 'notes': return notesView();
  }
  return '';
}

/* ---------- HOME ---------- */
function homeView(){
  const now = new Date();
  const h = now.getHours();
  const greet = h<12 ? 'Good morning' : (h<18 ? 'Good afternoon' : 'Good evening');
  const dateStr = now.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const reading = lib('reading'), later = lib('later'), done = lib('finished');
  const recs = state.books.filter(b=>!b.status).sort((a,b)=>b.rating-a.rating).slice(0,6);

  const target = state.challenge.target;
  const p = Math.min(1, done.length/target), C = 163.4;
  const chalLabel = state.challenge.type==='yearly'
    ? `${now.getFullYear()} Reading Challenge`
    : `${now.toLocaleDateString('en-US',{month:'long'})} Challenge`;

  let html = `
  <div class="headbar" style="margin-bottom:8px">
    <div><div class="brand">Shelved<em>.</em></div><div class="sub-date">${dateStr}</div></div>
    <div class="spacer"></div>
    <button class="icon-btn" data-action="open-challenge" aria-label="Challenge settings">${I.gear}</button>
  </div>
  <p style="font-weight:700;color:var(--ink2);font-size:13.5px;margin-bottom:16px">${greet}, reader — your shelves missed you.</p>

  <div class="card dark-card chal">
    <svg class="ring" viewBox="0 0 64 64">
      <circle class="c1" cx="32" cy="32" r="26"></circle>
      <circle class="c2" cx="32" cy="32" r="26" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 32 32)"></circle>
      <text x="32" y="37" text-anchor="middle" fill="#f5ead9" font-size="14" font-weight="800" font-family="Manrope">${done.length}/${target}</text>
    </svg>
    <div>
      <div class="eyebrow" style="color:#cbb59a">Book challenge</div>
      <h3>${chalLabel}</h3>
      <p>${done.length} of ${target} books read</p>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#f5ead9" data-action="open-challenge">Settings</button>
    </div>
  </div>`;

  /* Currently reading */
  html += `<div class="sec"><h2>Currently reading</h2><span class="count">${reading.length}</span></div>`;
  if(reading.length){
    html += `<div class="hscroll">` + reading.map(b=>`
      <div class="rcard" data-action="open-book" data-id="${b.id}">
        ${cover(b,86,true)}
        <div class="rc-i">
          <div class="rc-t">${esc(b.title)}</div>
          <div class="rc-a">${esc(b.author)}</div>
          <div class="pbar" style="margin-top:auto"><i style="width:${pctOf(b)}%"></i></div>
          <div class="rc-m"><span>${pctOf(b)}% · Update progress</span></div>
        </div>
      </div>`).join('') + `</div>`;
  } else {
    html += `<div class="empty"><div class="e-ic">${I.bookopen}</div><h4>Nothing in progress</h4><p>Pick something from Read Later or explore the catalog.</p><button class="btn btn-primary btn-sm" data-action="go-explore">Explore books</button></div>`;
  }

  /* Recommended */
  html += `<div class="sec"><h2>Recommended for you</h2><button class="link" data-action="open-recs">See more →</button></div>`;
  if(recs.length) html += `<div class="hscroll">${recs.map(gcard).join('')}</div>`;

  /* Reading later */
  html += `<div class="sec"><h2>Reading later</h2><span class="count">${later.length}</span></div>`;
  if(later.length){
    html += later.map(b=>`
      <div class="row" data-action="open-book" data-id="${b.id}">
        ${cover(b,46,false)}
        <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>
        <button class="btn btn-soft btn-sm" data-action="set-status" data-id="${b.id}" data-status="reading">Start</button>
      </div>`).join('');
  } else html += `<div class="empty" style="padding:18px"><p style="margin:0">Your Read Later shelf is empty.</p></div>`;

  /* Finished */
  html += `<div class="sec"><h2>Finished</h2><span class="count">${done.length}</span></div>`;
  if(done.length){
    html += done.map(b=>`
      <div class="row" data-action="open-book" data-id="${b.id}">
        ${cover(b,46,false)}

        <span class="pill finished">Finished</span>
      </div>`).join('');

  return html;

/* ---------- RECS ---------- */
function recsView(){
  const recs = state.books.filter(b=>!b.status).sort((a,b)=>b.rating-a.rating);
  return headBar('Recommended for you','Back to Explore · picked for your taste') +
    (recs.length ? `<div class="grid">${recs.map(gcard).join('')}</div>`
      : `<div class="empty"><div class="e-ic">${I.checkcircle}</div><h4>All caught up</h4><p>Every recommendation is already on your shelves.</p></div>`);
}

/* ---------- BOOKS (library) ---------- */
function booksView(){
  const f = state.libFilter;
  const shelved = state.books.filter(b=>b.status);
  const shown = f==='all' ? shelved : shelved.filter(b=>b.status===f);
  const order = {reading:0, later:1, finished:2};
  shown.sort((a,b)=>order[a.status]-order[b.status]);

  let html = `
  <div class="headbar"><div><div class="eyebrow">Your shelves</div><h1 class="pg-title">Library</h1></div><div class="spacer"></div><span class="count" style="font-weight:800;color:var(--ink2)">${shelved.length} shelved</span></div>
  <div class="seg filter-seg">
    ${['all','reading','later','finished'].map(k=>`<button class="${f===k?'on':''}" data-action="lib-filter" data-f="${k}">${k==='all'?'All':LBL[k]}</button>`).join('')}
  </div>`;

  if(shown.length){
    html += shown.map(b=>`
      <div class="row" data-action="open-book" data-id="${b.id}">
        ${cover(b,46,false)}
        <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}${b.status==='reading'?` · ${pctOf(b)}%`:''}</div></div>
        <span class="pill ${b.status}">${LBL[b.status]}</span>
      </div>`).join('');
  } else {
    html += `<div class="empty"><div class="e-ic">${I.books}</div><h4>Nothing here yet</h4><p>Books you shelve will live on this shelf.</p><button class="btn btn-primary btn-sm" data-action="go-explore">Explore books</button></div>`;
  }

  html += `<div class="sec"><h2>Book lists</h2><button class="btn btn-soft btn-sm" data-action="open-create-list">${I.plus} Create New List</button></div>`;
  html += state.lists.map(L=>{
    const bs = L.bookIds.map(byId).filter(Boolean);
    return `<div class="card list-card" data-action="open-list" data-id="${L.id}" style="margin-bottom:12px">
      <div class="lc-top"><div class="lc-name">${esc(L.name)}</div><span class="count" style="color:var(--ink2);font-weight:800;font-size:11.5px">${bs.length} book${bs.length===1?'':'s'}</span></div>
      ${L.desc?`<div class="lc-desc">${esc(L.desc)}</div>`:''}
      ${bs.length?`<div class="lc-covers">${bs.slice(0,4).map(b=>cover(b,40,false)).join('')}${bs.length>4?`<div class="more">+${bs.length-4}</div>`:''}</div>`:''}
    </div>`;
  }).join('');
  return html;
}

/* ---------- LIST DETAIL ---------- */
function listView(id){
  const L = state.lists.find(l=>l.id===id);
  if(!L) return booksView();
  const bs = L.bookIds.map(byId).filter(Boolean);
  const confirming = state.confirmList===id;
  let html = headBar(esc(L.name), L.desc || `${bs.length} book${bs.length===1?'':'s'}`) + `
  <div style="display:flex;gap:8px;margin-bottom:18px">
    <button class="btn btn-primary btn-sm" data-action="open-add-books" data-id="${id}">${I.plus} Add books</button>
    <button class="btn btn-danger btn-sm" data-action="del-list" data-id="${id}">${I.trash} ${confirming?'Tap to confirm':'Delete List'}</button>
  </div>`;
  if(bs.length){
    html += `<div class="grid">${bs.map(gcard).join('')}</div>`;
  } else {
    html += `<div class="empty"><div class="e-ic">${I.list}</div><h4>This list is empty.</h4><p>Explore books to add them here!</p><button class="btn btn-primary btn-sm" data-action="go-explore">Explore books</button></div>`;
  }
  return html;
}

/* ---------- STATS ---------- */
function statsView(){
  const done = lib('finished'), reading = lib('reading'), shelved = state.books.filter(b=>b.status);
  const pages = done.reduce((s,b)=>s+b.pages,0) + reading.reduce((s,b)=>s+b.progress,0);

  const agg = key => {
    const m = {};
    shelved.forEach(b=>{ m[b[key]] = (m[b[key]]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  };
  const genres = agg('genre').slice(0,4), langs = agg('lang').slice(0,3);
  const maxG = genres.length? genres[0][1] : 1, maxL = langs.length? langs[0][1] : 1;

  const target = state.challenge.target, p = Math.min(1, done.length/target), C = 163.4;

  return `
  <div class="headbar"><div><div class="eyebrow">Your year in books</div><h1 class="pg-title">Stats</h1></div></div>
  <div class="stat-grid">
    <div class="card"><div class="stat-n">${done.length}</div><div class="stat-l">Books read</div></div>
    <div class="card"><div class="stat-n">${pages.toLocaleString()}</div><div class="stat-l">Pages read</div></div>
  </div>
  <div class="card dark-card chal" style="margin-top:12px">
    <svg class="ring" viewBox="0 0 64 64">
      <circle class="c1" cx="32" cy="32" r="26"></circle>
      <circle class="c2" cx="32" cy="32" r="26" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 32 32)"></circle>
      <text x="32" y="37" text-anchor="middle" fill="#f5ead9" font-size="14" font-weight="800" font-family="Manrope">${done.length}/${target}</text>
    </svg>
    <div><div class="eyebrow" style="color:#cbb59a">Book challenge</div><h3>${done.length} of ${target} books read</h3><p>${reading.length} in progress right now</p></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="eyebrow">Top genres</div>
    ${genres.length? genres.map(([g,n])=>`
      <div class="bar-row"><div class="bar-h"><span>${g}</span><span>${n}</span></div>
      <div class="bar-track"><i style="width:${Math.round(n/maxG*100)}%"></i></div></div>`).join('')
      : `<p style="margin-top:10px;font-size:12.5px;font-weight:600;color:var(--ink2)">Shelve books to see your taste.</p>`}
  </div>
  <div class="card" style="margin-top:12px">
    <div class="eyebrow">Top languages</div>
    ${langs.length? langs.map(([l,n])=>`
      <div class="bar-row"><div class="bar-h"><span>${l}</span><span>${n}</span></div>
      <div class="bar-track"><i class="green" style="width:${Math.round(n/maxL*100)}%"></i></div></div>`).join('') : ''}
  </div>`;
}

/* ---------- EXPLORE ---------- */
function exploreView(){
  return `
  <div class="headbar"><div><div class="eyebrow">Browse the catalog</div><h1 class="pg-title">Explore</h1></div></div>
  <form class="searchbar" data-form="search">
    ${I.search}
    <input id="searchInput" placeholder="Search titles, authors, genres…" value="${esc(state.q)}" autocomplete="off">
    <button type="button" id="clearSearchBtn" class="icon-btn mini" data-action="clear-search" style="display:${state.q?'grid':'none'}" aria-label="Clear search">${I.x}</button>
  </form>
  <div id="exploreBody">${exploreBody()}</div>`;
}
function exploreBody(){
  if(state.q.trim()) return searchResultsHTML();
  const trending = [...state.books].sort((a,b)=>b.rating-a.rating).slice(0,8);
  return `
  <div class="sec"><h2>Trending this week</h2></div>
  <div class="hscroll">${trending.map(gcard).join('')}</div>
  <div class="sec"><h2>Genres</h2><button class="link" data-action="open-genres">Explore more →</button></div>
  <div class="hscroll">${GENRES.map(g=>`<button class="chip" data-action="open-genre" data-genre="${g}">${g}</button>`).join('')}</div>
  <div class="sec"><h2>For you</h2></div>
  <div class="grid">${state.books.filter(b=>!b.status).sort((a,b)=>b.rating-a.rating).slice(0,3).map(gcard).join('')}</div>`;
}
function searchResultsHTML(){
  const q = state.q.trim().toLowerCase();
  const res = state.books.filter(b => (b.title+' '+b.author+' '+b.genre).toLowerCase().includes(q));
  return `
  <div class="sec"><h2>Search results</h2><span class="count">${res.length} match${res.length===1?'':'es'}</span></div>
  <button class="btn btn-ghost btn-sm" data-action="clear-search" style="margin-bottom:14px">${I.x} Clear search</button>
  ${res.length ? `<div class="grid">${res.map(gcard).join('')}</div>`
    : `<div class="empty"><div class="e-ic">${I.search}</div><h4>No matches</h4><p>Try a different title, author or genre.</p></div>`}`;
}

/* ---------- GENRE ---------- */
function genreView(g){
  const bs = state.books.filter(b=>b.genre===g);
  return headBar(`${g} books`, `${bs.length} titles · Back to Explore`) + `<div class="grid">${bs.map(gcard).join('')}</div>`;
}
function genresView(){
  return headBar('Explore genres','Back to Explore') + GENRES.map(g=>{
    const bs = state.books.filter(b=>b.genre===g);
    return `<div class="g-big" style="background:${GENRE_BG[g]}" data-action="open-genre" data-genre="${g}">
      <div class="minis">${bs.slice(0,3).map(b=>cover(b,44,false)).join('')}</div>
      <h3>${g}</h3><span>${bs.length} titles</span>
    </div>`;
  }).join('');
}

/* ---------- NOTES ---------- */
function notesView(){
  let html = `<div class="headbar"><div><div class="eyebrow">Your notebook</div><h1 class="pg-title">Notes &amp; Quotes</h1></div></div>`;
  if(!state.notes.length){
    return html + `<div class="empty"><div class="e-ic">${I.quote}</div><h4>You haven\u2019t added any notes yet.</h4><p>Open a book from your library to add a note!</p><button class="btn btn-primary btn-sm" data-action="tab" data-tab="books">Open your library</button></div>`;
  }
  return html + state.notes.map(n=>{
    const b = byId(n.bookId);
    return `<div class="card note-card">
      <button class="icon-btn mini del" data-action="del-note" data-id="${n.id}" aria-label="Delete note">${I.trash}</button>
      <div class="n-book">${b?cover(b,34,false):''}<div><div class="n-t">${b?esc(b.title):''}</div><div class="n-a">${b?esc(b.author):''}</div></div></div>
      <blockquote>“${esc(n.text)}”</blockquote>
      <div class="n-date">${n.date}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   MODALS
============================================================ */
function modalHTML(m){
  let inner = '';
  if(m.type==='book') inner = bookSheet(m);
  if(m.type==='challenge') inner = challengeSheet();
  if(m.type==='picker') inner = pickerSheet(m);
  if(m.type==='addbooks') inner = addBooksSheet(m);
  if(m.type==='create') inner = createSheet(m);
  return `<div class="overlay" data-action="close-modal"></div><div class="sheet">${inner}</div>`;
}

function bookSheet(m){
  const b = byId(m.id);
  const myLists = state.lists.filter(L=>L.bookIds.includes(b.id));
  const myNotes = state.notes.filter(n=>n.bookId===b.id);
  return `
  <div class="grabber"></div>
  <button class="icon-btn sheet-x" data-action="close-modal" aria-label="Close">${I.x}</button>
  <div class="bm-top">
    ${cover(b,112,true)}
    <div style="min-width:0">
      <div class="bm-chips"><span class="chip tiny">${b.genre}</span><span class="pill ${b.status||'none'}">${b.status?LBL[b.status]:'Not shelved'}</span></div>
      <div class="bm-t">${esc(b.title)}</div>
      <div class="bm-a">by ${esc(b.author)}</div>
      <div class="bm-meta">${stars(b.rating)} ${b.rating.toFixed(1)} · ${b.pages} pp · ${b.lang}</div>
    </div>
  </div>
  <p class="bm-blurb">${esc(b.blurb)}</p>

  <div class="eyebrow" style="margin-bottom:8px">Shelf — one status at a time</div>
  <div class="seg">
    ${['later','reading','finished'].map(s=>`<button class="${b.status===s?'on':''}" data-action="set-status" data-id="${b.id}" data-status="${s}" title="${b.status===s?'Tap again to remove from library':''}">${STATUS_ICON[s]} ${LBL[s]}</button>`).join('')}
  </div>

  ${b.status==='reading' ? `
  <div class="card prog-card">
    <div class="prog-h"><span class="eyebrow">Update progress</span><span class="prog-pct">${pctOf(b)}%</span></div>
    <div class="pbar"><i style="width:${pctOf(b)}%"></i></div>
    <form data-form="progress">
      <div class="prog-row">
        <input id="progInput" type="number" min="0" max="${b.pages}" value="${b.progress}" aria-label="Current page">
        <span class="prog-total">/ ${b.pages} pages</span>
        <button class="btn btn-primary btn-sm" type="submit">Save progress</button>
      </div>
    </form>
  </div>` : ''}

  <div class="bm-actions">
    <button class="btn btn-ghost btn-sm" data-action="open-list-picker" data-id="${b.id}">${I.list} Add to list</button>
    ${myLists.length?`<span class="in-lists">In: ${myLists.map(L=>esc(L.name)).join(' · ')}</span>`:''}
  </div>

  <div class="divider"></div>
  <div class="eyebrow" style="margin-bottom:10px">Notes &amp; quotes</div>
  ${myNotes.map(n=>`<div class="card" style="margin-bottom:10px"><blockquote style="font-family:var(--f-disp);font-size:14px;line-height:1.5">“${esc(n.text)}”</blockquote><div class="n-date" style="margin-top:8px;font-size:11px;font-weight:800;color:var(--ink2)">${n.date}</div></div>`).join('')}
  <form data-form="note">
    <div class="field" style="margin-top:0"><textarea id="noteInput" rows="3" placeholder="Add a note or quote…"></textarea></div>
    <button class="btn btn-soft btn-sm" type="submit" style="margin-top:10px">${I.notes} Save note</button>
  </form>`;
}

function challengeSheet(){
  const c = state.challenge;
  return `
  <div class="grabber"></div>
  <button class="icon-btn sheet-x" data-action="close-modal">${I.x}</button>
  <h2 class="pg-title" style="margin-bottom:4px">Challenge settings</h2>
  <form data-form="challenge">
    <div class="eyebrow" style="margin:14px 0 8px">Challenge type</div>
    <div class="seg two">
      <label class="${c.type==='yearly'?'on':''}"><input type="radio" name="chType" value="yearly" ${c.type==='yearly'?'checked':''}>Yearly challenge</label>
      <label class="${c.type==='monthly'?'on':''}"><input type="radio" name="chType" value="monthly" ${c.type==='monthly'?'checked':''}>Monthly challenge</label>
    </div>
    <div class="field"><label for="chTarget">Target books</label><input id="chTarget" type="number" min="1" max="365" value="${c.target}"></div>
    <button class="btn btn-primary full" type="submit" style="margin-top:18px">Save changes</button>
  </form>`;
}

function pickerSheet(m){
  const b = byId(m.bookId);
  return `
  <div class="grabber"></div>
  <button class="icon-btn sheet-x" data-action="close-modal">${I.x}</button>
  <h2 class="pg-title">Add to list</h2>
  <p style="font-size:12.5px;font-weight:700;color:var(--ink2);margin:4px 0 14px">“${esc(b.title)}”</p>
  ${state.lists.map(L=>{
    const on = L.bookIds.includes(b.id);
    return `<div class="pick-row" data-action="toggle-list" data-list="${L.id}" data-book="${b.id}">
      <span class="cbox ${on?'on':''}">${I.check}</span>
      <div class="info"><div class="t">${esc(L.name)}</div><div class="a">${L.bookIds.length} book${L.bookIds.length===1?'':'s'}</div></div>
    </div>`;
  }).join('') || `<p style="font-size:13px;font-weight:600;color:var(--ink2)">No lists yet — create one below.</p>`}
  <div class="divider"></div>
  <button class="btn btn-soft btn-sm" data-action="open-create-list" data-id="${b.id}">${I.plus} Create New List</button>`;
}

function addBooksSheet(m){
  const L = state.lists.find(l=>l.id===m.listId);
  const q = (m.q||'').trim().toLowerCase();
  const bs = q ? state.books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)) : state.books;
  return `
  <div class="grabber"></div>
  <div class="headbar" style="margin-bottom:12px">
    <button class="icon-btn" data-action="close-modal">${I.back}</button>
    <div><div class="hb-t">All books</div><div class="hb-s">Adding to “${esc(L.name)}”</div></div>
  </div>
  <form class="searchbar" data-form="search">${I.search}<input id="pickSearch" placeholder="Filter titles…" value="${esc(m.q||'')}" autocomplete="off"></form>
  <div id="pickBody" style="margin-top:8px">${pickRows(bs, L)}</div>`;
}
function pickRows(bs, L){
  return bs.map(b=>{
    const on = L.bookIds.includes(b.id);
    return `<div class="pick-row" data-action="toggle-list" data-list="${L.id}" data-book="${b.id}">
      ${cover(b,38,true)}
      <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>
      <span class="cbox ${on?'on':''}">${I.check}</span>
    </div>`;
  }).join('') || `<p style="font-size:13px;font-weight:600;color:var(--ink2);padding:10px">No matches.</p>`;
}

function createSheet(m){
  return `
  <div class="grabber"></div>
  <button class="icon-btn sheet-x" data-action="close-modal">${I.x}</button>
  <h2 class="pg-title">Create New List</h2>
  <form data-form="create-list">
    <div class="field"><label for="clName">List name *</label><input id="clName" required maxlength="40" placeholder="e.g. Autumn TBR"></div>
    <div class="field"><label for="clDesc">Description (optional)</label><input id="clDesc" maxlength="80" placeholder="What is this list about?"></div>
    <button class="btn btn-primary full" type="submit" style="margin-top:18px">Create List</button>
  </form>`;
}

/* ============================================================
   RENDER + NAV
============================================================ */
function render(){
  const scr = $('screen');
  scr.innerHTML = `<div class="view">${viewHTML()}</div>`;
  $('tabbar').innerHTML = [['home','Home',I.home],['books','Books',I.books],['stats','Stats',I.stats],['explore','Explore',I.explore],['notes','Notes',I.notes]]
    .map(([k,l,ic])=>`<button class="tab ${state.tab===k&&!state.stack.length?'on':''}" data-action="tab" data-tab="${k}">${ic}${l}</button>`).join('');
  const m = state.modal;
  const root = $('modalRoot');
  root.className = 'modal-root'+(m?' open':'');
  root.innerHTML = m ? modalHTML(m) : '';
  scr.scrollTop = 0;
  popIds.clear();
}
function go(tab){ state.tab=tab; state.stack=[]; state.modal=null; if(tab!=='explore') state.q=''; render(); }
function push(v){ state.stack.push(v); state.modal=null; render(); }
function pop(){ state.stack.pop(); state.modal=null; render(); }

function updateExplore(){
  const el = $('exploreBody'); if(el) el.innerHTML = exploreBody();
  const cb = $('clearSearchBtn'); if(cb) cb.style.display = state.q ? 'grid' : 'none';
}

/* ---------- toast ---------- */
function toast(msg, actLabel){
  toastAction = actLabel ? (toastActionPending||null) : null;
  const root = $('toastRoot');
  root.innerHTML = `<div class="toast"><span>${msg}</span>${actLabel?`<button class="toast-act" data-action="toast-act">${actLabel}</button>`:''}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; toastAction=null; }, 3400);
}
let toastActionPending = null;
function toastWithAction(msg, label, fn){
  toastActionPending = fn;
  toast(msg, label);
  toastAction = fn; toastActionPending = null;
}
function runToastAction(){
  if(toastAction){ const fn = toastAction; toastAction=null; $('toastRoot').innerHTML=''; fn(); }
}

/* ============================================================
   MUTATIONS
============================================================ */
function setStatus(id, s){
  const b = byId(id); const prev = b.status;
  if(prev===s){
    b.status = null;
    toast(`Removed “${esc(b.title)}” from your library`);
  } else {
    b.status = s;
    if(s==='finished') b.progress = b.pages;
    popIds.add(id);
    toast(prev ? `Moved: ${LBL[prev]} → ${LBL[s]}` : `Shelved in ${LBL[s]}`);
  }
  render();
}

function toggleList(listId, bookId){
  const L = state.lists.find(l=>l.id===listId); if(!L) return;
  const i = L.bookIds.indexOf(bookId);
  if(i>-1){ L.bookIds.splice(i,1); toast(`Removed from “${esc(L.name)}”`); }
  else { L.bookIds.push(bookId); toast(`Added to “${esc(L.name)}”`); }
  render();
}

function delList(id){
  if(state.confirmList!==id){
    state.confirmList = id;
    setTimeout(()=>{ if(state.confirmList===id){ state.confirmList=null; render(); } }, 2600);
    render(); return;
  }
  const i = state.lists.findIndex(l=>l.id===id);
  const [L] = state.lists.splice(i,1);
  state.confirmList = null; state.stack.pop();
  toastWithAction(`List “${esc(L.name)}” deleted`, 'Undo', ()=>{ state.lists.push(L); render(); });
  render();
}

/* ============================================================
   EVENTS
============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch(a){
    case 'tab': go(el.dataset.tab); break;
    case 'back': pop(); break;
    case 'go-explore': go('explore'); break;
    case 'open-book': state.modal={type:'book', id}; render(); break;
    case 'close-modal': state.modal=null; render(); break;
    case 'open-recs': push({name:'recs'}); break;
    case 'open-genres': push({name:'genres'}); break;
    case 'open-genre': push({name:'genre', genre: el.dataset.genre}); break;
    case 'open-list': push({name:'list', id}); break;
    case 'lib-filter': state.libFilter = el.dataset.f; render(); break;
    case 'set-status': setStatus(id, el.dataset.status); break;
    case 'clear-search': state.q=''; render(); break;
    case 'open-challenge': state.modal={type:'challenge'}; render(); break;
    case 'open-list-picker': state.modal={type:'picker', bookId:id}; render(); break;
    case 'open-add-books': state.modal={type:'addbooks', listId:id, q:''}; render(); break;
    case 'open-create-list': state.modal={type:'create', bookId:id||null}; render(); break;
    case 'toggle-list': toggleList(el.dataset.list, el.dataset.book); break;
    case 'del-list': delList(id); break;
    case 'del-note': state.notes = state.notes.filter(n=>n.id!==id); toast('Note deleted'); render(); break;
    case 'toast-act': runToastAction(); break;
  }
});

document.addEventListener('input', e=>{
  if(e.target.id==='searchInput'){ state.q = e.target.value; updateExplore(); }
  if(e.target.id==='pickSearch' && state.modal && state.modal.type==='addbooks'){
    state.modal.q = e.target.value;
    const L = state.lists.find(l=>l.id===state.modal.listId);
    const q = state.modal.q.trim().toLowerCase();
    const bs = q ? state.books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)) : state.books;
    const body = $('pickBody'); if(body && L) body.innerHTML = pickRows(bs, L);
  }
});

document.addEventListener('submit', e=>{
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const kind = f.dataset.form;

  if(kind==='search') return;

  if(kind==='progress' && state.modal){
    const b = byId(state.modal.id);
    const v = Math.max(0, Math.min(b.pages, parseInt($('progInput').value,10)||0));
    b.progress = v;
    if(v>=b.pages){
      if(b.status!=='finished'){ b.status='finished'; popIds.add(b.id); toast(`🎉 Finished “${esc(b.title)}” — moved to Finished`); }
      else toast('Progress saved');
    } else {
      if(!b.status){ b.status='reading'; popIds.add(b.id); }
      toast(`Progress saved · page ${v} of ${b.pages}`);
    }
    render();
  }

  if(kind==='note' && state.modal){
    const t = $('noteInput').value.trim(); if(!t) return;
    state.notes.unshift({id:'n'+Date.now(), bookId:state.modal.id, text:t, date:fmtDate(new Date())});
    toast('Note saved to your notebook');
    render();
  }

  if(kind==='challenge'){
    const type = f.querySelector('input[name=chType]:checked').value;
    const target = Math.max(1, parseInt($('chTarget').value,10)||1);
    state.challenge = {type, target};
    state.modal = null;
    toast('Challenge updated');
    render();
  }

  if(kind==='create-list'){
    const name = $('clName').value.trim(); if(!name) return;
    const desc = $('clDesc').value.trim();
    const bookId = state.modal && state.modal.bookId ? state.modal.bookId : null;
    state.lists.push({id:'l'+Date.now(), name, desc, bookIds: bookId?[bookId]:[]});
    state.modal = null;
    toast(`List “${esc(name)}” created`);
    render();
  }
});

/* boot */
render();
</script>
</body>
</html>
