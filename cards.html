<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Collectibles Gallery</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            background-color: #f3f4fc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex m-0 p-0 w-full overflow-x-hidden">

    <!-- STREAMING_CHUNK:Rendering sidebar... -->
    <!-- Floating Sidebar -->
    <aside class="w-24 h-screen py-8 px-0 flex flex-col items-center justify-between border-r border-white/50 bg-white/40 backdrop-blur-xl z-30 sticky top-0 flex-shrink-0">
        <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-sm text-indigo-500 mb-8 cursor-pointer hover:scale-105 transition-transform" onclick="switchTab('home')">
            <i data-lucide="landmark" class="w-6 h-6"></i>
        </div>
        
        <nav class="flex flex-col items-center gap-6">
            <button onclick="switchTab('home')" id="nav-home" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 bg-indigo-100 text-indigo-600 shadow-sm scale-110">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>
            <button onclick="switchTab('collection')" id="nav-collection" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 text-slate-400 hover:bg-white hover:text-slate-600">
                <i data-lucide="heart" class="w-5 h-5"></i>
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 text-slate-400 hover:bg-white hover:text-slate-600">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </button>
        </nav>
        
        <div class="mt-auto">
            <div class="w-12 h-12 rounded-full bg-indigo-100 border-2 border-white text-indigo-500 shadow-inner flex items-center justify-center">
                <i data-lucide="user" class="w-5 h-5"></i>
            </div>
        </div>
    </aside>

    <!-- STREAMING_CHUNK:Rendering main layout container... -->
    <!-- Main Content Area (Fluid full-width layout) -->
    <main class="flex-1 min-h-screen p-6 sm:p-10 lg:p-14 relative w-full overflow-y-auto">
        
        <!-- Top Header Decorator -->
        <header class="mb-10 flex items-center justify-between">
            <div class="h-12 w-64 bg-white/50 rounded-2xl border border-white/60 shadow-sm flex items-center px-4 space-x-3">
                <div class="w-10 h-2 bg-indigo-200 rounded-full"></div>
                <div class="w-6 h-2 bg-slate-200 rounded-full"></div>
            </div>
            
            <div class="h-10 w-24 bg-white/50 rounded-full border border-white/60 shadow-sm flex items-center justify-center space-x-2">
                <div class="w-4 h-2 bg-indigo-200 rounded-full"></div>
                <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
            </div>
        </header>

        <!-- STREAMING_CHUNK:Initializing state banners and views... -->
        <!-- Error Banner -->
        <div id="error-banner" class="hidden mb-6 p-4 bg-red-50 text-red-600 rounded-2xl border border-red-100 flex items-center space-x-3">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span id="error-message"></span>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center h-64 space-y-4">
            <i data-lucide="loader-2" class="animate-spin text-indigo-400 w-8 h-8"></i>
            <p class="text-slate-400">Loading gallery...</p>
        </div>

        <!-- Add Item View -->
        <div id="view-add" class="hidden max-w-xl mx-auto bg-white/60 backdrop-blur-lg p-8 rounded-3xl shadow-sm border border-white/80">
            <h2 class="text-2xl font-light mb-6 text-slate-700">Add to Collection</h2>
            <form id="mint-form" onsubmit="handleMint(event)" class="space-y-5">
                <div>
                    <label class="block text-sm text-slate-500 mb-1 ml-1">Title</label>
                    <input type="text" id="mint-title" required class="w-full bg-white/80 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 placeholder-slate-400 shadow-sm" placeholder="e.g. Marble Bust" />
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-1 ml-1">Image URL</label>
                    <input type="url" id="mint-image" required class="w-full bg-white/80 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 placeholder-slate-400 shadow-sm" placeholder="https://..." />
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-1 ml-1">Category</label>
                    <select id="mint-category" class="w-full bg-white/80 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 shadow-sm appearance-none">
                        <option>Sculpture</option>
                        <option>Relief</option>
                        <option>Architecture</option>
                        <option>Painting</option>
                        <option>Art</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-1 ml-1">Description (Optional)</label>
                    <textarea id="mint-desc" class="w-full bg-white/80 border-none rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-700 placeholder-slate-400 shadow-sm h-24 resize-none" placeholder="Details about this piece..."></textarea>
                </div>
                <button type="submit" id="mint-btn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl py-4 font-medium transition-colors shadow-lg shadow-indigo-200 flex items-center justify-center space-x-2">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span>Add to Collection</span>
                </button>
            </form>
        </div>

        <!-- STREAMING_CHUNK:Rendering gallery grid without container boxes... -->
        <!-- Fluid Gallery Grid View -->
        <div id="view-gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8 pb-24 transition-all duration-300">
            <!-- Cards injected via JS -->
        </div>

        <!-- STREAMING_CHUNK:Rendering dedicated item detail view with right floating panel... -->
        <!-- Full Detailed Item View (Grid on left, floating preview panel on right) -->
        <div id="view-item-detail" class="hidden pb-24 relative">
            
            <!-- Left side: Main Page Content & Additional Cards Grid (3 in a row) -->
            <div id="detail-left-content" class="pr-0 lg:pr-[450px] transition-all duration-300">
                <div class="mb-8 flex items-center justify-between">
                    <div>
                        <span id="detail-category-tag" class="text-xs font-bold tracking-widest text-indigo-400 uppercase block mb-1">ART</span>
                        <h2 id="detail-title-header" class="text-3xl font-light text-slate-800">Item Title</h2>
                        <p id="detail-subtitle" class="text-xs text-slate-400 mt-0.5">Explore additional high-resolution cards associated with this collectible.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="goBackToGallery()" class="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-white/80 hover:bg-white text-slate-600 shadow-sm border border-white/60 transition-all font-medium text-sm">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Back</span>
                        </button>
                        <div id="detail-delete-box" class="hidden flex items-center gap-2 bg-red-50 p-1.5 rounded-2xl border border-red-100">
                            <span class="text-xs text-red-600 font-medium px-2">Delete?</span>
                            <button onclick="toggleDetailDeleteConfirm(false)" class="px-2.5 py-1 bg-white text-slate-600 rounded-xl text-xs font-medium shadow-sm">No</button>
                            <button onclick="deleteCurrentItem()" class="px-2.5 py-1 bg-red-500 text-white rounded-xl text-xs font-medium shadow-sm">Yes</button>
                        </div>
                        <button id="detail-delete-trigger" onclick="toggleDetailDeleteConfirm(true)" class="p-2.5 rounded-2xl bg-white/80 hover:bg-red-50 text-slate-400 hover:text-red-500 shadow-sm border border-white/60 transition-all" title="Delete Item">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 3 in a Row Additional Images Grid (Direct Images as Cards) -->
                <div id="detail-additional-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Cards injected via JS -->
                </div>
            </div>

            <!-- Right side: Fixed Floating Preview Panel matching second reference -->
            <aside id="floating-preview-panel" class="fixed top-6 right-6 bottom-6 w-full max-w-[400px] bg-white rounded-[36px] shadow-2xl border border-white/80 p-6 flex flex-col justify-between z-20 backdrop-blur-xl">
                
                <!-- Panel Header Controls -->
                <div class="flex items-center justify-between mb-4">
                    <button onclick="goBackToGallery()" class="w-9 h-9 bg-slate-100/80 hover:bg-slate-200 text-slate-600 rounded-full flex items-center justify-center transition-all shadow-sm">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                    <button id="floating-like-btn" onclick="toggleDetailLike()" class="w-9 h-9 bg-slate-100/80 hover:bg-slate-200 rounded-full flex items-center justify-center transition-all text-slate-500 shadow-sm">
                        <i data-lucide="heart" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Main Floating Preview Body -->
                <div class="flex-1 flex gap-4 items-center overflow-hidden my-2">
                    
                    <!-- Vertical Thumbnails Column on the Left -->
                    <div class="w-16 flex flex-col items-center gap-3 overflow-y-auto py-2 hide-scrollbar max-h-[420px]">
                        <div class="w-6 h-1 bg-slate-100 rounded-full mb-1 flex items-center justify-center">
                            <div class="w-2.5 h-1.5 bg-indigo-400 rounded-full"></div>
                        </div>
                        <div id="floating-thumbnails-list" class="flex flex-col gap-3 w-full items-center">
                            <!-- Thumbnails injected via JS -->
                        </div>
                        <button onclick="toggleAddImageModal(true)" class="w-14 h-14 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 text-slate-400 hover:text-indigo-500 hover:border-indigo-300 hover:bg-indigo-50 flex items-center justify-center transition-all flex-shrink-0 mt-1" title="Add Image URL">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Large Main Preview Image on the Right -->
                    <div class="flex-1 h-full bg-slate-50/50 rounded-2xl overflow-hidden border border-slate-100 shadow-inner flex items-center justify-center p-4 relative">
                        <img id="floating-main-image" src="" alt="Main Cover Card" class="max-w-full max-h-full object-contain mix-blend-multiply drop-shadow-md transition-all duration-300" />
                    </div>
                </div>

                <!-- Panel Bottom Info -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div>
                        <span id="floating-panel-category" class="text-[10px] font-bold tracking-widest text-indigo-400 uppercase block mb-0.5">ART</span>
                        <h3 id="floating-panel-title" class="font-medium text-slate-800 text-base truncate w-48">Item Title</h3>
                    </div>
                    <button onclick="toggleAddImageModal(true)" class="px-4 py-2.5 rounded-2xl bg-indigo-500 hover:bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all text-xs font-medium flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>Add Image</span>
                    </button>
                </div>
            </aside>
        </div>

        <!-- Add Image URL Modal Overlay -->
        <div id="add-image-modal" class="hidden fixed inset-0 z-50 bg-slate-900/15 backdrop-blur-sm flex items-center justify-center p-4" onclick="toggleAddImageModal(false)">
            <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 relative" onclick="event.stopPropagation()">
                <h3 class="text-xl font-light text-slate-800 mb-2">Add Another Image Card</h3>
                <p class="text-xs text-slate-400 mb-4">Paste a direct image link below to add it as a new card.</p>
                <input type="url" id="new-image-url" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 mb-6 outline-none focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 text-sm" placeholder="https://..." />
                <div class="flex justify-end gap-3">
                    <button onclick="toggleAddImageModal(false)" class="px-5 py-2.5 rounded-xl text-slate-500 hover:bg-slate-100 font-medium text-sm">Cancel</button>
                    <button onclick="saveNewImage()" class="px-6 py-2.5 rounded-xl bg-indigo-500 text-white hover:bg-indigo-600 shadow-md font-medium text-sm flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span>Save Image</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- STREAMING_CHUNK:Initializing application runtime scripts... -->
    <script>
        const SUPABASE_URL = 'https://fwzffqwjprjuwidkrckb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3emZmcXdqcHJqdXdpZGtyY2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMTMwNzMsImV4cCI6MjA2MzU4OTA3M30.p3b_pshzTN-G3QTKE91b5TGBZJwSRZTEOClXN5JEl6I';

        const SUPABASE_HEADERS = {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
        };

        let collectibles = [];
        let likedItems = new Set(JSON.parse(localStorage.getItem('local_likes') || '[]'));
        let activeTab = 'home';
        let currentDetailItem = null;
        let activeFloatingImage = null;

        window.onload = function() {
            fetchCollectibles();
            lucide.createIcons();
        };

        async function fetchCollectibles() {
            try {
                showLoading(true);
                hideError();
                const response = await fetch(SUPABASE_URL + '/rest/v1/collectibles?select=*&order=created_at.desc', {
                    headers: SUPABASE_HEADERS
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || 'HTTP Error ' + response.status);
                }

                collectibles = await response.json();
                renderGallery();
                
                if (currentDetailItem) {
                    const updated = collectibles.find(c => c.id === currentDetailItem.id);
                    if (updated) {
                        openDetailPage(updated.id, false);
                    } else {
                        goBackToGallery();
                    }
                }
            } catch (err) {
                console.error("Error fetching data:", err);
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        function switchTab(tab) {
            activeTab = tab;
            goBackToGallery();
            
            document.getElementById('nav-home').className = tab === 'home' 
                ? 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 bg-indigo-100 text-indigo-600 shadow-sm scale-110'
                : 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 text-slate-400 hover:bg-white hover:text-slate-600';
            
            document.getElementById('nav-collection').className = tab === 'collection' 
                ? 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 bg-indigo-100 text-indigo-600 shadow-sm scale-110'
                : 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 text-slate-400 hover:bg-white hover:text-slate-600';

            document.getElementById('nav-add').className = tab === 'add' 
                ? 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 bg-indigo-100 text-indigo-600 shadow-sm scale-110'
                : 'w-12 h-12 rounded-2xl flex items-center justify-center transition-all duration-300 text-slate-400 hover:bg-white hover:text-slate-600';

            document.getElementById('view-add').classList.toggle('hidden', tab !== 'add');
            document.getElementById('view-gallery').classList.toggle('hidden', tab === 'add');
            
            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('view-gallery');
            const displayItems = activeTab === 'collection'
                ? collectibles.filter(item => likedItems.has(item.id))
                : collectibles;

            if (displayItems.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400">' + (activeTab === 'collection' ? "You haven't liked any items yet." : "No collectibles found in database.") + '</div>';
                return;
            }

            let html = '';
            displayItems.forEach(item => {
                const isLiked = likedItems.has(item.id);
                html += `
                    <div onclick="openDetailPage('${item.id}')" class="cursor-pointer group flex flex-col">
                        <div class="relative w-full h-72 rounded-3xl overflow-hidden shadow-md group-hover:shadow-2xl group-hover:-translate-y-1 transition-all duration-300">
                            <img src="${item.image_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                            <button onclick="toggleLike(event, '${item.id}')" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center shadow-sm transition-colors ${isLiked ? 'text-red-500' : 'text-slate-400 hover:text-indigo-400'}">
                                <i data-lucide="heart" class="w-4 h-4" ${isLiked ? 'fill="currentColor"' : ''}></i>
                            </button>
                        </div>
                        <div class="mt-3 flex items-center justify-between px-1">
                            <div>
                                <span class="text-[10px] font-bold tracking-widest text-indigo-400 uppercase block mb-0.5">${item.category || 'Art'}</span>
                                <h3 class="font-medium text-slate-800 text-sm truncate w-44">${item.title}</h3>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-white text-slate-400 flex items-center justify-center shadow-sm group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            lucide.createIcons();
        }

        function toggleLike(e, id) {
            e.stopPropagation();
            if (likedItems.has(id)) {
                likedItems.delete(id);
            } else {
                likedItems.add(id);
            }
            localStorage.setItem('local_likes', JSON.stringify(Array.from(likedItems)));
            renderGallery();
            if (currentDetailItem && currentDetailItem.id === id) {
                updateDetailLikeButton();
            }
        }

        function openDetailPage(id) {
            currentDetailItem = collectibles.find(c => c.id === id);
            if (!currentDetailItem) return;

            activeFloatingImage = currentDetailItem.image_url;

            document.getElementById('view-gallery').classList.add('hidden');
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('view-item-detail').classList.remove('hidden');

            document.getElementById('detail-title-header').innerText = currentDetailItem.title;
            document.getElementById('detail-category-tag').innerText = currentDetailItem.category || 'ART';
            document.getElementById('detail-subtitle').innerText = (currentDetailItem.category || 'Art') + ' • ' + (currentDetailItem.description || 'An exquisite piece of digital history.');

            document.getElementById('floating-panel-title').innerText = currentDetailItem.title;
            document.getElementById('floating-panel-category').innerText = currentDetailItem.category || 'ART';
            document.getElementById('floating-main-image').src = activeFloatingImage;

            updateDetailLikeButton();
            toggleDetailDeleteConfirm(false);
            renderAdditionalImagesGrid();
            renderFloatingThumbnails();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackToGallery() {
            currentDetailItem = null;
            document.getElementById('view-item-detail').classList.add('hidden');
            if (activeTab === 'add') {
                document.getElementById('view-add').classList.remove('hidden');
            } else {
                document.getElementById('view-gallery').classList.remove('hidden');
            }
            renderGallery();
        }

        function renderAdditionalImagesGrid() {
            const grid = document.getElementById('detail-additional-grid');
            const allImages = [currentDetailItem.image_url, ...(currentDetailItem.additional_images || [])];

            let html = '';
            allImages.forEach((img, index) => {
                const isMain = index === 0;
                html += `
                    <div class="flex flex-col group">
                        <div class="relative w-full h-96 rounded-3xl overflow-hidden shadow-md group-hover:shadow-2xl transition-all duration-300 flex items-center justify-center bg-slate-50">
                            <img src="${img}" alt="Card View ${index + 1}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                            ${isMain ? '<span class="absolute top-4 left-4 text-[10px] bg-white/80 backdrop-blur text-indigo-600 px-3 py-1 rounded-full font-bold uppercase tracking-wider shadow-sm">Primary Cover</span>' : ''}
                        </div>
                        <div class="mt-3 flex items-center justify-between px-1">
                            <span class="text-xs font-medium text-slate-500">${isMain ? 'Main Cover Card' : 'Additional Card #' + index}</span>
                            ${!isMain ? `
                                <button onclick="removeAdditionalImage('${img}')" class="w-8 h-8 rounded-full bg-red-50 text-red-400 hover:text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors shadow-sm">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            lucide.createIcons();
        }

        function renderFloatingThumbnails() {
            const container = document.getElementById('floating-thumbnails-list');
            const allImages = [currentDetailItem.image_url, ...(currentDetailItem.additional_images || [])];

            let html = '';
            allImages.forEach((img, index) => {
                const isActive = activeFloatingImage === img;
                html += `
                    <button onclick="setActiveFloatingImage('${img}')" class="w-12 h-14 rounded-xl overflow-hidden border-2 transition-all flex-shrink-0 shadow-sm relative ${isActive ? 'border-indigo-500 ring-2 ring-indigo-100 scale-105' : 'border-white opacity-70 hover:opacity-100'}">
                        <img src="${img}" class="w-full h-full object-cover" />
                    </button>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function setActiveFloatingImage(imgUrl) {
            activeFloatingImage = imgUrl;
            document.getElementById('floating-main-image').src = imgUrl;
            renderFloatingThumbnails();
        }

        function updateDetailLikeButton() {
            if (!currentDetailItem) return;
            const isLiked = likedItems.has(currentDetailItem.id);
            const btn = document.getElementById('floating-like-btn');
            btn.className = 'w-9 h-9 rounded-full flex items-center justify-center transition-all shadow-sm ' + (isLiked ? 'bg-red-50 text-red-500' : 'bg-slate-100/80 hover:bg-slate-200 text-slate-500');
            btn.innerHTML = `<i data-lucide="heart" class="w-4 h-4" ${isLiked ? 'fill="currentColor"' : ''}></i>`;
            lucide.createIcons();
        }

        function toggleDetailLike() {
            if (currentDetailItem) {
                toggleLike({ stopPropagation: () => {} }, currentDetailItem.id);
            }
        }

        function toggleAddImageModal(show) {
            document.getElementById('add-image-modal').classList.toggle('hidden', !show);
            if (show) {
                document.getElementById('new-image-url').value = '';
                document.getElementById('new-image-url').focus();
            }
        }

        async function saveNewImage() {
            const url = document.getElementById('new-image-url').value;
            if (!url || !currentDetailItem) return;

            try {
                const currentExtra = currentDetailItem.additional_images || [];

                if (!response.ok) throw new Error("Failed to add image");
                const jsonResponse = await response.json();
                if (!jsonResponse || jsonResponse.length === 0) throw new Error("Update blocked by database policy.");

                currentDetailItem = jsonResponse[0];
                collectibles = collectibles.map(c => c.id === currentDetailItem.id ? currentDetailItem : c);
                
                toggleAddImageModal(false);
                renderAdditionalImagesGrid();

            if (!currentDetailItem) return;
            try {
                const currentExtra = currentDetailItem.additional_images || [];
                const updatedExtra = currentExtra.filter(url => url !== imgUrlToRemove);

                const response = await fetch(SUPABASE_URL + '/rest/v1/collectibles?id=eq.' + currentDetailItem.id, {
                    method: 'PATCH',
                    headers: Object.assign({}, SUPABASE_HEADERS, { 'Prefer': 'return=representation' }),

                currentDetailItem = jsonResponse[0];
                collectibles = collectibles.map(c => c.id === currentDetailItem.id ? currentDetailItem : c);
                
                if (activeFloatingImage === imgUrlToRemove) {
                    activeFloatingImage = currentDetailItem.image_url;

        async function handleMint(e) {
            e.preventDefault();
            const title = document.getElementById('mint-title').value;
            const image_url = document.getElementById('mint-image').value;
            const category = document.getElementById('mint-category').value;
            const description = document.getElementById('mint-desc').value;

            if (!title || !image_url) return;

                const response = await fetch(SUPABASE_URL + '/rest/v1/collectibles', {
