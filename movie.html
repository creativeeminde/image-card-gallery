<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MovieGather</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest-movie.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Visual Gallery">
    
    <!-- Dynamic SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23000'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Inter, sans-serif' font-weight='900' font-size='50' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">

    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f2f6f9;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .fade-enter {
            opacity: 0;
            transform: scale(1.05);
        }
        .fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 700ms, transform 700ms;
        }

        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        a, button, select, input, textarea, [role="button"], .cursor-pointer {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .overflow-x-auto, .overflow-y-auto {
            -webkit-overflow-scrolling: touch;
        }

        @media (hover: none) {
            .hover\:-translate-y-1:hover,
            .hover\:-translate-y-1:active,
            .group:hover .group-hover\:-translate-y-1 {
                transform: none !important;
                transition: none !important;
            }

            .group:hover .group-hover\:scale-105,
            .group-hover\:scale-105:hover,
            .hover\:scale-105:hover,
            .hover\:scale-105:active,
            .group:active .group-hover\:scale-105 {
                transform: none !important;
                transition: none !important;
            }

            .group:hover .group-hover\:scale-110,
            .group-hover\:scale-110:hover,
            .hover\:scale-110:hover,
            .hover\:scale-110:active,
            .group:active .group-hover\:scale-110 {
                transform: none !important;
                transition: none !important;
            }

            .active\:scale-98:active,
            .active\:scale-95:active,
            .active\:scale-90:active {
                transform: none !important;
                transition: none !important;
            }

            .transition-transform, .transition-all {
                transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const SUPABASE_URL = 'https://fwzffqwjprjuwidkrckb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3emZmcXdqcHJqdXdpZGtyY2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMTMwNzMsImV4cCI6MjA2MzU4OTA3M30.p3b_pshzTN-G3QTKE91b5TGBZJwSRZTEOClXN5JEl6I';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const Icon = ({ name, className = "h-4 w-4", ...props }) => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (containerRef.current && name) {
                    const iconObj = lucide.icons[name];
                    if (iconObj) {
                        containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                        lucide.createIcons({ nameAttr: 'data-lucide', icons: { [name]: iconObj } });
                    } else {
                        containerRef.current.innerHTML = '';
                    }
                }
            }, [name, className]);

            return <span ref={containerRef} {...props} className={`inline-flex items-center justify-center ${props.className || ''}`}></span>;
        };

        const TMDB_API_KEY = 'e9b4a6ba169a41fbbe8d5db08584c138';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

        const GENRE_MAP_MOVIE = {
            'Action': 28, 'Adventure': 12, 'Animation': 16, 'Comedy': 35,
            'Crime': 80, 'Documentary': 99, 'Drama': 18, 'Family': 10751,
            'Fantasy': 14, 'History': 36, 'Horror': 27, 'Music': 10402,
            'Mystery': 9648, 'Romance': 10749, 'Sci-Fi': 878, 'Thriller': 53, 'War': 10752
        };

        const GENRE_MAP_TV = {
            'Action': 10759, 'Adventure': 10759, 'Animation': 16, 'Comedy': 35,
            'Crime': 80, 'Documentary': 99, 'Drama': 18, 'Family': 10751,
            'Fantasy': 10765, 'Mystery': 9648, 'Sci-Fi': 10765, 'Soap': 10766, 'War': 10768
        };

        const COUNTRY_MAP = {
            'United States': 'US', 'Japan': 'JP', 'United Kingdom': 'GB', 
            'South Korea': 'KR', 'France': 'FR', 'Spain': 'ES', 'Canada': 'CA'
        };

        const GENRES_BOARD = [
            { name: 'Action', icon: 'Swords' },
            { name: 'Comedy', icon: 'Smile' },
            { name: 'Historical', icon: 'Landmark' },
            { name: 'Drama', icon: 'BookOpen' },
            { name: 'Sci fi', icon: 'Rocket' },
            { name: 'Fantasy', icon: 'Wand2' },
            { name: 'Musical', icon: 'Music' },
            { name: 'Documentary', icon: 'Film' },
        ];

        const isFutureRelease = (dateString) => {
            if (!dateString) return false;
            return new Date(dateString) > new Date();
        };

        const getSeriesStatusInfo = (status, nextEpisode, forOverlay = false) => {
            if (!status) return { label: 'Unknown', colorClass: 'bg-gray-100 text-gray-600 border-gray-200' };
            const statusLower = status.toLowerCase();
            
            if (statusLower === 'ended' || statusLower === 'canceled') {
                const color = statusLower === 'ended' ? 'red' : 'rose';
                return { 
                    label: statusLower === 'ended' ? 'Ended' : 'Canceled', 
                    colorClass: forOverlay ? `bg-${color}-500/90 text-white border-${color}-400` : `bg-${color}-50 text-${color}-600 border-${color}-100` 
                };
            }
            if (statusLower === 'returning series' || statusLower === 'in production' || statusLower === 'planned') {
                if (nextEpisode) {
                    return { label: 'Ongoing', colorClass: forOverlay ? 'bg-emerald-600/95 text-white border-emerald-400 animate-pulse' : 'bg-emerald-50 text-emerald-600 border-emerald-100' };
                }
                return { label: 'Returning', colorClass: forOverlay ? 'bg-indigo-600/90 text-white border-indigo-400' : 'bg-indigo-50 text-indigo-600 border-indigo-100' };
            }
            if (statusLower === 'pilot') {
                return { label: 'Upcoming', colorClass: forOverlay ? 'bg-amber-500/90 text-white border-amber-400' : 'bg-amber-50 text-amber-600 border-amber-100' };
            }
            return { label: status, colorClass: forOverlay ? 'bg-blue-600/90 text-white border-blue-400' : 'bg-blue-50 text-blue-600 border-blue-100' };
        };

        function MobileEpisodeDetailsView({ showId, seasonNum, episodeNum, goBack, navigateToState, trackedItems, updateTvProgress }) {
            const [epData, setEpData] = useState(null);
            const [showData, setShowData] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                let active = true;
                setIsLoading(true);
                const fetchAll = async () => {
                    try {
                        const [showRes, epRes] = await Promise.all([
                            fetch(`${TMDB_BASE_URL}/tv/${showId}?api_key=${TMDB_API_KEY}`),
                            fetch(`${TMDB_BASE_URL}/tv/${showId}/season/${seasonNum}/episode/${episodeNum}?api_key=${TMDB_API_KEY}`)
                        ]);
                        if (active) {
                            setShowData(await showRes.json());
                            setEpData(await epRes.json());
                            setIsLoading(false);
                        }
                    } catch (e) { console.error(e); }
                };
                fetchAll();
                return () => { active = false; };
            }, [showId, seasonNum, episodeNum]);

            const { prevEp, nextEp } = useMemo(() => {
                if (!showData?.seasons) return { prevEp: null, nextEp: null };
                const regularSeasons = showData.seasons.filter(s => s.season_number > 0).sort((a, b) => a.season_number - b.season_number);
                const sIdx = regularSeasons.findIndex(s => s.season_number === seasonNum);
                if (sIdx === -1) return { prevEp: null, nextEp: null };

                const currentSeason = regularSeasons[sIdx];
                let prev = null;
                let next = null;

                if (episodeNum > 1) {
                    prev = { season: seasonNum, episode: episodeNum - 1 };
                } else if (sIdx > 0) {
                    const prevSeason = regularSeasons[sIdx - 1];
                    prev = { season: prevSeason.season_number, episode: prevSeason.episode_count };
                }

                if (episodeNum < currentSeason.episode_count) {
                    next = { season: seasonNum, episode: episodeNum + 1 };
                } else if (sIdx < regularSeasons.length - 1) {
                    const nextSeason = regularSeasons[sIdx + 1];
                    if (nextSeason.episode_count > 0) {
                        next = { season: nextSeason.season_number, episode: 1 };
                    }
                }
                return { prevEp: prev, nextEp: next };
            }, [showData, seasonNum, episodeNum]);

            const trackedShow = trackedItems.find(t => Number(t.media_id) === Number(showId) && t.media_type === 'tv');
            let watchedMap = {};
            if (trackedShow?.progress) {
                const prog = typeof trackedShow.progress === 'string' ? JSON.parse(trackedShow.progress) : trackedShow.progress;
                watchedMap = prog.watched_episodes || {};
            }
            const isWatched = watchedMap[`${seasonNum}_${episodeNum}`] === true;

            const handleToggleWatched = () => {
                const updated = { ...watchedMap };
                updated[`${seasonNum}_${episodeNum}`] = !isWatched;
                const regularSeasons = showData?.seasons?.filter(s => s.season_number > 0) || [];
                const totalEp = regularSeasons.reduce((acc, s) => acc + (s.episode_count || 0), 0);
                updateTvProgress(showId, updated, totalEp, showData);
            };

            const formatAirDate = (dateString) => {
                if (!dateString) return 'Unknown Air Date';
                return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            };

            if (isLoading) {
                return (
                    <div className="fixed inset-0 z-[150] bg-[#0a0a0c] flex items-center justify-center">
                        <div className="h-10 w-10 animate-spin rounded-full border-4 border-gray-700 border-t-green-500"></div>
                    </div>
                );
            }

            if (!epData) return null;

            const backdropUrl = epData.still_path 
                ? `https://image.tmdb.org/t/p/w780${epData.still_path}`
                : showData?.backdrop_path 
                    ? `https://image.tmdb.org/t/p/w780${showData.backdrop_path}` 
                    : 'https://via.placeholder.com/780x439?text=No+Image';

            return (
                <div className="fixed inset-0 z-[150] bg-[#0a0a0c] text-white overflow-y-auto no-scrollbar pb-24">
                    <div className="relative w-full aspect-[4/3] bg-gray-900">
                        <img src={backdropUrl} className="absolute inset-0 w-full h-full object-cover opacity-90" />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0c] via-[#0a0a0c]/40 to-transparent"></div>
                        <button 
                            onClick={goBack} 
                            className="absolute top-4 left-4 h-10 w-10 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md border border-white/10 text-white z-10 active:scale-90 transition-transform"
                        >
                            <Icon name="ArrowLeft" className="h-5 w-5" />
                        </button>
                    </div>

                    <div className="px-5 -mt-12 relative z-10">
                        <p 
                            onClick={() => navigateToState({ selectedEpisode: null })}
                            className="text-green-500 font-extrabold text-[11px] uppercase tracking-widest mb-1.5 cursor-pointer hover:text-green-400 w-max"
                        >
                            {showData?.name || 'Show Details'}
                        </p>
                        
                        <h1 className="text-2xl font-black text-white leading-tight mb-2">
                            S{String(seasonNum).padStart(2, '0')} · E{String(episodeNum).padStart(2, '0')} · {epData.name || 'Untitled Episode'}
                        </h1>
                        
                        <p className="text-gray-400 text-xs font-semibold mb-6">
                            Aired {formatAirDate(epData.air_date)}
                        </p>

                        <div className="flex bg-white/5 rounded-2xl p-1 mb-8 border border-white/10">
                            <button 
                                onClick={() => prevEp && navigateToState({ selectedEpisode: { season: prevEp.season, episode: prevEp.episode } }, true)}
                                disabled={!prevEp}
                                className={`flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl transition-all ${prevEp ? 'active:bg-white/10 hover:bg-white/5 cursor-pointer' : 'opacity-30'}`}
                            >
                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Previous</span>
                                <span className="text-sm font-black text-white">
                                    {prevEp ? `S${String(prevEp.season).padStart(2, '0')} E${String(prevEp.episode).padStart(2, '0')}` : '--'}
                                </span>
                            </button>
                            <div className="w-[1px] bg-white/10 my-2 mx-1"></div>
                            <button 
                                onClick={() => nextEp && navigateToState({ selectedEpisode: { season: nextEp.season, episode: nextEp.episode } }, true)}
                                disabled={!nextEp}
                                className={`flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl transition-all ${nextEp ? 'active:bg-white/10 hover:bg-white/5 cursor-pointer' : 'opacity-30'}`}
                            >
                                <span className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Next</span>
                                <span className="text-sm font-black text-white">
                                    {nextEp ? `S${String(nextEp.season).padStart(2, '0')} E${String(nextEp.episode).padStart(2, '0')}` : '--'}
                                </span>
                            </button>
                        </div>

                        <div className="flex items-center gap-4 mb-8">
                            <button 
                                onClick={handleToggleWatched}
                                className={`flex-1 py-3.5 rounded-2xl flex items-center justify-center gap-2 font-black text-sm transition-all active:scale-95 ${
                                    isWatched 
                                    ? 'bg-green-600/20 text-green-500 border border-green-600/30' 
                                    : 'bg-white text-black'
                                }`}
                            >
                                {isWatched ? (
                                    <>
                                        <Icon name="CheckCircle2" className="h-5 w-5" />
                                        <span>Finished</span>
                                    </>
                                ) : (
                                    <>
                                        <Icon name="Plus" className="h-5 w-5" />
                                        <span>Mark Finished</span>
                                    </>
                                )}
                            </button>

                            <div className="flex flex-col items-center justify-center bg-white/5 border border-white/10 rounded-2xl px-5 py-2.5 h-full">
                                <span className="text-white font-black text-sm flex items-center gap-1.5">
                                    <Icon name="Star" className="h-4 w-4 fill-green-500 text-green-500" />
                                    {(epData.vote_average || 0).toFixed(1)}
                                </span>
                                <span className="text-[9px] text-gray-500 font-bold uppercase tracking-wider mt-0.5">({epData.vote_count} votes)</span>
                            </div>
                        </div>

                        <div className="mb-8">
                            <h2 className="text-lg font-black text-white mb-3">Synopsis</h2>
                            <p className="text-sm text-gray-400 leading-relaxed">
                                {epData.overview || "No synopsis available for this episode."}
                            </p>
                        </div>

                        <div className="mb-8">
                            <h2 className="text-lg font-black text-white mb-3">Details</h2>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col justify-center">
                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Air Date</span>
                                    <span className="text-sm font-black text-white truncate">{formatAirDate(epData.air_date)}</span>
                                </div>
                                <div className="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col justify-center">
                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Runtime</span>
                                    <span className="text-sm font-black text-white">{epData.runtime ? `${epData.runtime} min` : 'N/A'}</span>
                                </div>
                                <div className="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col justify-center">
                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Season</span>
                                    <span className="text-sm font-black text-white">{seasonNum}</span>
                                </div>
                                <div className="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col justify-center">
                                    <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Episode</span>
                                    <span className="text-sm font-black text-white">{episodeNum}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MobileLibraryHeader({ 
            activeLibTab, setActiveLibTab, 
            favGenreFilter, setFavGenreFilter, 
            availableGenres, libraryFilter, setLibraryFilter,
            libraryTypeFilter, setLibraryTypeFilter
        }) {
            return (
                <div className="md:hidden pb-6 pt-2">
                    <div className="flex items-center gap-6 mb-6">
                        {['Watchlist', 'Upcoming', 'History'].map((tab) => (
                            <button 
                                key={tab}
                                onClick={() => setActiveLibTab(tab)}
                                className={`text-[28px] leading-none font-black transition-all ${activeLibTab === tab ? 'text-black' : 'text-gray-300'}`}
                            >
                                {tab}
                            </button>
                        ))}
                    </div>

                    <div className="flex gap-2.5 overflow-x-auto no-scrollbar mb-6 pb-1">
                        {['All', 'Series', 'Movies'].map(type => {
                            const val = type === 'Series' ? 'tv' : type === 'Movies' ? 'movie' : 'All';
                            return (
                                <button 
                                    key={type}
                                    onClick={() => setLibraryTypeFilter(val)}
                                    className={`shrink-0 px-5 py-2 rounded-full text-xs font-bold transition-all border shadow-sm ${libraryTypeFilter === val ? 'bg-black border-black text-white' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                                >
                                    {type}
                                </button>
                            );
                        })}
                    </div>

                    <div className="flex gap-2.5 overflow-x-auto no-scrollbar mb-6 pb-1">
                        {availableGenres.map(genre => (
                            <button 
                                key={genre}
                                onClick={() => setFavGenreFilter(genre)}
                                className={`shrink-0 px-5 py-2 rounded-full text-xs font-bold transition-all border shadow-sm ${favGenreFilter === genre ? 'bg-black border-black text-white' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                            >
                                {genre}
                            </button>
                        ))}
                    </div>

                    <div className="flex items-center gap-2.5 overflow-x-auto no-scrollbar pb-2">
                        <button className="shrink-0 w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 bg-white text-gray-700 shadow-sm">
                            <Icon name="SlidersHorizontal" className="w-4 h-4" />
                        </button>
                        {['Watching', 'Not Started', 'Finished', 'Paused', 'Dropped'].map(status => {
                            const appStatus = status === 'Not Started' ? 'Plan to Watch' : status === 'Paused' ? 'On Hold' : status;
                            return (
                                <button
                                    key={status}
                                    onClick={() => setLibraryFilter(appStatus)}
                                    className={`shrink-0 px-6 py-2 rounded-full text-[11px] font-extrabold transition-all border ${
                                        libraryFilter === appStatus
                                        ? 'bg-black border-black text-white shadow-md' 
                                        : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
                                    }`}
                                >
                                    {status}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function Section({ title, items, onSelect, isLoading }) {
            const scrollContainerRef = useRef(null);
            const scroll = (direction) => {
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollBy({ left: direction === 'left' ? -300 : 300, behavior: 'smooth' });
                }
            };

            return (
                <div className="mb-10">
                    <div className="mb-5 flex items-center justify-between">
                        <h2 className="text-xl font-extrabold tracking-wide">{title}</h2>
                        {!isLoading && (
                            <div className="flex space-x-2">
                                <button onClick={() => scroll('left')} className="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 hover:bg-white shadow-sm transition-all">
                                    <Icon name="ChevronLeft" className="h-5 w-5 text-gray-600" />
                                </button>
                                <button onClick={() => scroll('right')} className="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 hover:bg-white shadow-sm transition-all">
                                    <Icon name="ChevronRight" className="h-5 w-5 text-gray-600" />
                                </button>
                            </div>
                        )}
                    </div>

                    {isLoading ? (
                        <div className="flex h-[300px] w-full items-center justify-center">
                            <div className="h-8 w-8 animate-spin rounded-full border-4 border-gray-300 border-t-black"></div>
                        </div>
                    ) : (
                        <div ref={scrollContainerRef} className="flex space-x-5 overflow-x-auto no-scrollbar pb-4 scroll-smooth">
                            {items.length > 0 ? items.map((item, i) => (
                                <div key={i} onClick={() => onSelect(item.id, item.type)} className="group flex w-[170px] shrink-0 cursor-pointer flex-col gap-3">
                                    <div className="relative h-[250px] w-full overflow-hidden rounded-[1.25rem] shadow-sm">
                                        <img src={item.image} alt={item.title} className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                    </div>
                                    <div>
                                        <div className="mb-1.5 flex items-center space-x-3 text-[11px] font-bold text-gray-500">
                                            <span className="flex items-center"><Icon name="Star" className="mr-1 h-3 w-3 text-gray-400 fill-white" /> {item.rating}</span>

        function LibraryTvCard({ item, openDetails, handleRemoveTracking, handleTrackItem, updateTvProgress, openEpisodeDetails }) {
            const [tvDetails, setTvDetails] = useState(null);

                let prog = {};
                if (item.progress) prog = typeof item.progress === 'string' ? JSON.parse(item.progress) : item.progress;
                return { watched_episodes: prog?.watched_episodes || {} };
            }, [item.progress]);

            useEffect(() => {
                let active = true;
                const fetchDetails = async () => {
                    try {
                        const url = `${TMDB_BASE_URL}/tv/${item.media_id}?api_key=${TMDB_API_KEY}`;
                        const res = await fetch(url);
                        if (res.ok && active) setTvDetails(await res.json());
                    } catch (e) { console.error(e); } 
                    finally { if (active) setIsCardLoading(false); }
                };
                fetchDetails();
                return () => { active = false; };
            }, [item.media_id]);

            useEffect(() => {
                if (!tvDetails) return;
                const regularSeasons = tvDetails.seasons?.filter(s => s.season_number > 0) || [];
                const totalEpisodes = regularSeasons.reduce((acc, s) => acc + (s.episode_count || 0), 0);
                const watchedCount = Object.keys(progressInfo.watched_episodes).filter(k => progressInfo.watched_episodes[k] === true).length;
                
                if (item.status === 'Finished' && watchedCount < totalEpisodes && totalEpisodes > 0) {
                    handleTrackItem(item, 'Watching');
                }
            }, [tvDetails, progressInfo.watched_episodes, item.status]);

            const computedProgress = useMemo(() => {
                if (!tvDetails) return { nextS: 1, nextE: 1, totalEpisodes: 0, watchedCount: 0, foundNext: false };
                const regularSeasons = tvDetails.seasons?.filter(s => s.season_number > 0) || [];
                const totalEpisodes = regularSeasons.reduce((acc, s) => acc + (s.episode_count || 0), 0);
                const sortedSeasons = [...regularSeasons].sort((a, b) => a.season_number - b.season_number);
                
                let nextS = 1, nextE = 1, foundNext = false, lastS = 1, lastE = 1;

                for (const s of sortedSeasons) {
                    for (let ep = 1; ep <= s.episode_count; ep++) {
                        const key = `${s.season_number}_${ep}`;
                        if (progressInfo.watched_episodes[key]) {
                            lastS = s.season_number;
                            lastE = ep;
                        } else if (!foundNext) {
                            nextS = s.season_number;
                            nextE = ep;
                            foundNext = true;
                            break;
                        }
                    }
                    if (foundNext) break;
                }

                if (!foundNext) {
                    nextS = lastS;
                    nextE = lastE;
                }

                const watchedCount = Object.keys(progressInfo.watched_episodes).filter(k => progressInfo.watched_episodes[k] === true).length;
                return { nextS, nextE, totalEpisodes, watchedCount, foundNext };
            }, [tvDetails, progressInfo.watched_episodes]);

            useEffect(() => {
                if (!tvDetails) return;
                let active = true;
                const fetchSeason = async () => {
                    try {
                        const url = `${TMDB_BASE_URL}/tv/${item.media_id}/season/${computedProgress.nextS}?api_key=${TMDB_API_KEY}`;
                        const res = await fetch(url);
                        if (res.ok && active) setSeasonData(await res.json());
                    } catch (e) { console.error(e); }
                };
                fetchSeason();
                return () => { active = false; };
            }, [tvDetails, computedProgress.nextS]);

            const nextEpisodeInfo = useMemo(() => {
                if (!seasonData) return { title: 'Loading...', isPremiere: false, isFinale: false, isNew: false, thumbnail: null };
                const ep = seasonData.episodes?.find(e => e.episode_number === computedProgress.nextE);
                if (!ep) return { title: `Episode ${computedProgress.nextE}`, isPremiere: false, isFinale: false, isNew: false, thumbnail: null };

                let isNew = false;
                if (ep.air_date) {
                    const air = new Date(ep.air_date);
                    const now = new Date();
                    isNew = Math.ceil(Math.abs(now - air) / (1000 * 60 * 60 * 24)) <= 30 && air <= now;
                }

                return {
                    title: ep.name || `Episode ${computedProgress.nextE}`,
                    isPremiere: computedProgress.nextE === 1,
                    isFinale: computedProgress.nextE === seasonData.episodes.length,
                    isNew,
                    thumbnail: ep.still_path ? `https://image.tmdb.org/t/p/w300${ep.still_path}` : null
                };
            }, [seasonData, computedProgress.nextE]);

            const percentage = computedProgress.totalEpisodes > 0 ? Math.round((computedProgress.watchedCount / computedProgress.totalEpisodes) * 100) : 0;

            const handleMarkWatched = (e) => {
                e.stopPropagation();
                if (!computedProgress.foundNext) return;

                        ) : (
                            tvDetails?.status && <span className={`absolute top-2 right-2 rounded-full px-2 py-0.5 text-[8px] font-black tracking-widest uppercase border backdrop-blur-md shadow-sm ${getSeriesStatusInfo(tvDetails.status, tvDetails.next_episode_to_air, true).colorClass}`}>{getSeriesStatusInfo(tvDetails.status, tvDetails.next_episode_to_air, true).label}</span>
                        )}
                        <span className="absolute bottom-2 left-2 text-[10px] font-bold text-white tracking-wide">{computedProgress.watchedCount}/{computedProgress.totalEpisodes} Episodes ({percentage}%)</span>
                    </div>

                    <div className="flex-1 flex flex-col justify-between">
                        <div>
                            <h3 onClick={() => openDetails(item.media_id, 'tv')} className="cursor-pointer text-[15px] font-extrabold text-gray-900 group-hover:text-blue-600 transition-colors line-clamp-1 mb-2">{item.title}</h3>
                            <div className="bg-gray-50/70 border border-gray-100/50 rounded-2xl p-2.5 flex items-center justify-between gap-3 min-h-[58px]">

                                    <div className="flex flex-wrap items-center gap-1.5 mb-1">

                                    </div>
                                    <p className="text-xs font-semibold text-gray-700 truncate">{computedProgress.foundNext ? nextEpisodeInfo.title : 'Finished! 🎉'}</p>
                                </div>
                                {computedProgress.foundNext && (
                                    <button onClick={handleMarkWatched} className="w-10 h-10 shrink-0 rounded-full border border-blue-100 bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all shadow-sm"><Icon name="Check" className="h-5 w-5 stroke-[2.5]" /></button>
                                )}
                            </div>
                        </div>

                        <div className="mt-3.5 pt-3 border-t border-gray-100/80">
                            <div className="w-full bg-gray-100 h-1 rounded-full overflow-hidden mb-3"><div className="bg-blue-600 h-full transition-all duration-500" style={{ width: `${percentage}%` }} /></div>
                            <div className="flex items-center justify-between gap-3">
                                <select value={item.status} onClick={(e) => e.stopPropagation()} onChange={(e) => handleTrackItem(item, e.target.value)} className="text-[11px] font-bold text-gray-600 bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1.5 outline-none cursor-pointer focus:bg-white transition-all flex-1 min-w-0">
                                    <option value="Watching">Watching</option>
                                    <option value="Finished">Finished</option>
                                    <option value="Plan to Watch">Plan to Watch</option>
                                    <option value="On Hold">On Hold</option>
                                    <option value="Dropped">Dropped</option>
                                </select>
                                <button onClick={(e) => { e.stopPropagation(); handleRemoveTracking(item.media_id, 'tv'); }} className="p-1.5 text-red-500 hover:bg-red-50 rounded-xl border border-transparent hover:border-red-100 transition-all shrink-0"><Icon name="Trash" className="h-4 w-4" /></button>

                        )}
                    </div>
                    
                    <div className="flex-1 flex flex-col justify-start pt-1 min-w-0 relative">

                            <button onClick={(e) => { e.stopPropagation(); setIsMenuOpen(!isMenuOpen); }} className="absolute -top-1 -right-2 p-2 text-gray-400 hover:text-gray-900 z-10 transition-colors">
                                <Icon name="MoreHorizontal" className="h-6 w-6" />
                            </button>
                            
                            {isMenuOpen && (
                                <div className="absolute right-0 top-full w-44 bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl border border-gray-100 z-50 overflow-hidden py-1">

                                    {['Watching', 'Finished', 'Plan to Watch', 'On Hold', 'Dropped'].map((s) => (

            const [isDetailsLoading, setIsDetailsLoading] = useState(false);

            const [selectedPerson, setSelectedPerson] = useState(null);
            const [personData, setPersonData] = useState(null);
            const [isPersonLoading, setIsPersonLoading] = useState(false);
            const [actorSort, setActorSort] = useState('popularity');
            
            const castScrollRef = useRef(null);

            const [favorites, setFavorites] = useState([]);
            const [favFilter, setFavFilter] = useState('all'); 
            const [favGenreFilter, setFavGenreFilter] = useState('All'); 
            const [isFavLoading, setIsFavLoading] = useState(false);
            const [isActionInProgress, setIsActionInProgress] = useState(false);

            const [trackedItems, setTrackedItems] = useState([]);
            const [isTrackLoading, setIsTrackLoading] = useState(false);
            const [isTrackMenuOpen, setIsTrackMenuOpen] = useState(false);
            
            const [libraryFilter, setLibraryFilter] = useState('Watching'); 
            const [userChangedFilter, setUserChangedFilter] = useState(false);
            const [libraryTypeFilter, setLibraryTypeFilter] = useState('All');
            const [libraryGenreFilter, setLibraryGenreFilter] = useState('All');
            const [mobileLibTab, setMobileLibTab] = useState('Watchlist');

            const [expandedSeasons, setExpandedSeasons] = useState({});
            const [seasonEpisodesMap, setSeasonEpisodesMap] = useState({});

            const isRestoringRef = useRef(false);
            const stateRef = useRef();

            stateRef.current = {
                activeTab, fetchedShows, page, randomPageOffset,

                favFilter, favGenreFilter, libraryFilter, libraryTypeFilter, libraryGenreFilter, mobileLibTab
            };

            const replaceStateDebounceRef = useRef(null);
            const debouncedReplaceState = (state, title = '') => {
                if (replaceStateDebounceRef.current) clearTimeout(replaceStateDebounceRef.current);
                replaceStateDebounceRef.current = setTimeout(() => {
                    try { window.history.replaceState(state, title); } catch (e) {}
                }, 150);
            };

            const restoreStateSnapshot = (snapshot) => {
                if (!snapshot) return;
                isRestoringRef.current = true;
                if (snapshot.activeTab !== undefined) setActiveTab(snapshot.activeTab);
                if (snapshot.fetchedShows !== undefined) setFetchedShows(snapshot.fetchedShows);
                if (snapshot.page !== undefined) setPage(snapshot.page);
                if (snapshot.randomPageOffset !== undefined) setRandomPageOffset(snapshot.randomPageOffset);
                if (snapshot.filterYear !== undefined) setFilterYear(snapshot.filterYear);
                if (snapshot.filterGenre !== undefined) setFilterGenre(snapshot.filterGenre);
                if (snapshot.filterCountry !== undefined) setFilterCountry(snapshot.filterCountry);
                if (snapshot.boardGenre !== undefined) setBoardGenre(snapshot.boardGenre);
                if (snapshot.searchInput !== undefined) setSearchInput(snapshot.searchInput);
                if (snapshot.searchQuery !== undefined) setSearchQuery(snapshot.searchQuery);
                if (snapshot.selectedItem !== undefined) setSelectedItem(snapshot.selectedItem);
                if (snapshot.selectedPerson !== undefined) setSelectedPerson(snapshot.selectedPerson);
                if (snapshot.selectedEpisode !== undefined) setSelectedEpisode(snapshot.selectedEpisode);
                if (snapshot.favFilter !== undefined) setFavFilter(snapshot.favFilter);
                if (snapshot.favGenreFilter !== undefined) setFavGenreFilter(snapshot.favGenreFilter);
                if (snapshot.libraryFilter !== undefined) setLibraryFilter(snapshot.libraryFilter);
                if (snapshot.libraryTypeFilter !== undefined) setLibraryTypeFilter(snapshot.libraryTypeFilter);
                if (snapshot.libraryGenreFilter !== undefined) setLibraryGenreFilter(snapshot.libraryGenreFilter);
                if (snapshot.mobileLibTab !== undefined) setMobileLibTab(snapshot.mobileLibTab);

                setTimeout(() => {
                    window.scrollTo(0, snapshot.scrollPosition || 0);
                    isRestoringRef.current = false;
                }, 80);
            };

            const navigateToState = (updatedFields, replaceHistory = false) => {
                const currentScroll = window.scrollY;
                const currentHistoryState = window.history.state || {};
                
                if (!replaceHistory) {
                    try { window.history.replaceState({ ...currentHistoryState, scrollPosition: currentScroll }, ''); } catch (e) {}
                }

                const nextState = { ...stateRef.current, ...updatedFields, scrollPosition: 0 };
                
                if (replaceStateDebounceRef.current) clearTimeout(replaceStateDebounceRef.current);
                
                try { 
                    if (replaceHistory) {
                        window.history.replaceState(nextState, '');
                    } else {
                        window.history.pushState(nextState, ''); 
                    }
                } catch (e) {}
                
                restoreStateSnapshot(nextState);
            };

            useEffect(() => {
                if (isRestoringRef.current) return;
                const currentState = window.history.state || {};
                debouncedReplaceState({ ...currentState, ...stateRef.current }, '');
            }, [
                activeTab, fetchedShows, page, randomPageOffset,
                filterYear, filterGenre, filterCountry,
                boardGenre, searchInput, searchQuery, selectedItem, selectedPerson, selectedEpisode,
                favFilter, favGenreFilter, libraryFilter, libraryTypeFilter, libraryGenreFilter, mobileLibTab
            ]);

            useEffect(() => {
                const handleScrollSave = () => {
                    if (isRestoringRef.current) return;
                    const currentState = window.history.state;
                    if (currentState) debouncedReplaceState({ ...currentState, scrollPosition: window.scrollY }, '');
                };
                window.addEventListener('scroll', handleScrollSave, { passive: true });
                return () => window.removeEventListener('scroll', handleScrollSave);
            }, []);

            useEffect(() => {
                return () => { if (replaceStateDebounceRef.current) clearTimeout(replaceStateDebounceRef.current); };
            }, []);

            const trailerKey = useMemo(() => {

                if (officialTrailer) return officialTrailer.key;
                const anyTrailer = detailsData.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                if (anyTrailer) return anyTrailer.key;
                const anyVideo = detailsData.videos.results.find(v => v.site === 'YouTube');
