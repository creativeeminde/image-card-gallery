            const repairMissingGenres = async (favList) => {
                const missing = favList.filter(f => !f.genres);
                if (missing.length === 0) return;
                for (const item of missing) {
                    try {
                        if (item.media_type && item.media_id) {
                            const url = `${TMDB_BASE_URL}/${item.media_type}/${item.media_id}?api_key=${TMDB_API_KEY}`;
                            const res = await fetch(url);
                            if (!res.ok) continue;
                            const data = await res.json();
                            const genresString = data.genres ? data.genres.map(g => g.name).join(', ') : 'Uncategorized';
                            await supabase.from('favorites').update({ genres: genresString }).match({ media_id: item.media_id, media_type: item.media_type });
                        }
                    } catch (e) {}
                }
                fetchFavorites();
            };

            const fetchFavorites = async () => {
                setIsFavLoading(true);
                const { data, error } = await supabase.from('favorites').select('*').order('created_at', { ascending: false });
                if (!error) {
                    setFavorites(data || []);
                    if (data?.some(f => !f.genres)) repairMissingGenres(data);
                }
                setIsFavLoading(false);
            };

            const toggleFavorite = async (item) => {
                if (isActionInProgress) return;
                setIsActionInProgress(true);
                const itemId = Number(item.media_id || item.id);
                const itemType = item.type || item.media_type;
                const isFav = isFavorited(itemId, itemType);

                if (isFav) {
                    const newFavorites = favorites.filter(fav => !(Number(fav.media_id) === itemId && fav.media_type === itemType));
                    setFavorites(newFavorites);
                    try { await supabase.from('favorites').delete().match({ media_id: itemId, media_type: itemType }); } catch (err) {} 
                    finally { setIsActionInProgress(false); fetchFavorites(); }
                } else {
                    const genresString = item.genres ? item.genres.map(g => g.name).join(', ') : 'Uncategorized';
                    const payload = { media_id: itemId, media_type: itemType, title: item.title, poster_path: item.poster_path, rating: item.vote_average?.toFixed(1) || 'N/A', genres: genresString, created_at: new Date().toISOString() };
                    const newFavorites = [payload, ...favorites];
                    setFavorites(newFavorites);
                    try { await supabase.from('favorites').insert([payload]); } catch (err) {} 
                    finally { setIsActionInProgress(false); fetchFavorites(); }
                }
            };

            const fetchTracking = async () => {
                setIsTrackLoading(true);
                try {
                    const { data, error } = await supabase.from('tracking').select('*').order('updated_at', { ascending: false });
                    if (error) throw error;
                    setTrackedItems(data || []);
                    localStorage.setItem('moviegather_tracking', JSON.stringify(data || []));
                } catch (err) {
                    const localData = localStorage.getItem('moviegather_tracking');
                    setTrackedItems(localData ? JSON.parse(localData) : []);
                } finally { setIsTrackLoading(false); }
            };

            const handleTrackItem = async (item, status) => {
                if (isActionInProgress) return;
                setIsActionInProgress(true);
                const itemId = Number(item.media_id || item.id);
                const itemType = item.type || item.media_type;
                const title = item.title || item.name || detailsData?.title || detailsData?.name;
                const poster_path = item.poster_path || detailsData?.poster_path;
                const rating = (item.vote_average || item.rating || detailsData?.vote_average || 0);
                
                let genresString = 'Uncategorized';
                if (item.genres) genresString = Array.isArray(item.genres) ? item.genres.map(g => g.name).join(', ') : String(item.genres);
                else if (detailsData?.genres) genresString = detailsData.genres.map(g => g.name).join(', ');

                const existingItem = trackedItems.find(t => Number(t.media_id) === itemId && t.media_type === itemType);
                const trackingPayload = {
                    media_id: itemId, media_type: itemType, title, poster_path, rating: typeof rating === 'number' ? rating.toFixed(1) : String(rating),
                    genres: genresString, status, progress: existingItem?.progress || {}, updated_at: new Date().toISOString()
                };
                if (existingItem && existingItem.id) trackingPayload.id = existingItem.id;

                const newTrackedItems = [...trackedItems];
                const idx = newTrackedItems.findIndex(t => Number(t.media_id) === itemId && t.media_type === itemType);
                if (idx > -1) newTrackedItems[idx] = { ...newTrackedItems[idx], ...trackingPayload };
                else newTrackedItems.unshift(trackingPayload);
                setTrackedItems(newTrackedItems);
                localStorage.setItem('moviegather_tracking', JSON.stringify(newTrackedItems));

                try { await supabase.from('tracking').upsert(trackingPayload); } catch (error) {} 
                finally { setIsActionInProgress(false); fetchTracking(); }
            };

            const handleRemoveTracking = async (id, type) => {
                if (isActionInProgress) return;
                setIsActionInProgress(true);
                const newTrackedItems = trackedItems.filter(t => !(Number(t.media_id) === Number(id) && t.media_type === type));
                setTrackedItems(newTrackedItems);
                localStorage.setItem('moviegather_tracking', JSON.stringify(newTrackedItems));
                try { await supabase.from('tracking').delete().match({ media_id: Number(id), media_type: type }); } catch (error) {} 
                finally { setIsActionInProgress(false); fetchTracking(); }
            };

            const getTrackingStatus = (id, type) => {
                const found = trackedItems.find(t => Number(t.media_id) === Number(id) && t.media_type === type);
                return found ? found.status : null;
            };

            const getTvProgress = (item) => {
                if (!item) return { watched_episodes: {}, watched_count: 0, total_episodes: 0, percentage: 0 };
                const prog = typeof item.progress === 'string' ? JSON.parse(item.progress) : (item.progress || {});
                const watched_episodes = prog.watched_episodes || {};
                const watched_count = Object.keys(watched_episodes).filter(k => watched_episodes[k] === true).length;
                const total_episodes = prog.total_episodes || 0;
                return { watched_episodes, watched_count, total_episodes, percentage: total_episodes > 0 ? Math.round((watched_count / total_episodes) * 100) : 0 };
            };

            const updateTvProgress = async (mediaId, newWatchedEpisodes, totalCount, activeShowData = null) => {
                if (isActionInProgress) return;
                setIsActionInProgress(true);
                const sourceData = activeShowData || detailsData;
                const numericId = Number(mediaId);
                const foundItem = trackedItems.find(t => Number(t.media_id) === numericId && t.media_type === 'tv');
                const watchedCount = Object.keys(newWatchedEpisodes).filter(k => newWatchedEpisodes[k] === true).length;

                let targetStatus = foundItem ? foundItem.status : 'Watching';
                if (totalCount > 0) {
                    if (watchedCount === totalCount) targetStatus = 'Finished';
                    else if (targetStatus === 'Finished' && watchedCount < totalCount) targetStatus = 'Watching';
                }

                const payload = {
                    media_id: numericId, media_type: 'tv', title: sourceData?.name || foundItem?.title || 'Unknown', poster_path: sourceData?.poster_path || foundItem?.poster_path || '',
                    rating: (sourceData?.vote_average || Number(foundItem?.rating) || 0).toFixed(1),
                    genres: sourceData?.genres ? sourceData.genres.map(g => g.name).join(', ') : (foundItem?.genres || 'Uncategorized'),
                    status: targetStatus, progress: { watched_episodes: newWatchedEpisodes, total_episodes: totalCount, watched_count: watchedCount },
                    updated_at: new Date().toISOString()
                };
                if (foundItem && foundItem.id) payload.id = foundItem.id;

                const newTrackedItems = [...trackedItems];
                const idx = newTrackedItems.findIndex(t => Number(t.media_id) === numericId && t.media_type === 'tv');
                if (idx > -1) newTrackedItems[idx] = { ...newTrackedItems[idx], ...payload };
                else newTrackedItems.unshift(payload);
                setTrackedItems(newTrackedItems);
                localStorage.setItem('moviegather_tracking', JSON.stringify(newTrackedItems));

                try { await supabase.from('tracking').upsert(payload); } catch (error) {} 
                finally { setIsActionInProgress(false); fetchTracking(); }
            };

            useEffect(() => { fetchFavorites(); fetchTracking(); }, []);
            useEffect(() => { if (activeTab === 'FAVORITES') fetchFavorites(); if (activeTab === 'LIBRARY') fetchTracking(); }, [activeTab]);

            useEffect(() => {
                const handleOutsideClick = (e) => { if (isTrackMenuOpen && !e.target.closest('.track-menu-container')) setIsTrackMenuOpen(false); };
                document.addEventListener('click', handleOutsideClick);
                return () => document.removeEventListener('click', handleOutsideClick);
            }, [isTrackMenuOpen]);

            useEffect(() => { setExpandedSeasons({}); setSeasonEpisodesMap({}); }, [selectedItem]);

            const availableFavGenres = useMemo(() => {
                const genresSet = new Set(['All']);
                favorites.forEach(fav => { if (fav.genres) fav.genres.split(', ').forEach(g => genresSet.add(g)); });
                return Array.from(genresSet).sort((a, b) => {
                    if (a === 'All') return -1;
                    if (b === 'All') return 1;
                    return a.localeCompare(b);
                });
            }, [favorites]);

            const filteredFavorites = useMemo(() => {
                return favorites.filter(fav => {
                    const typeMatch = favFilter === 'all' || fav.media_type === favFilter;
                    const genreMatch = favGenreFilter === 'All' || (fav.genres && fav.genres.includes(favGenreFilter));
                    return typeMatch && genreMatch;
                });
            }, [favorites, favFilter, favGenreFilter]);

            const availableTrackedGenres = useMemo(() => {
                const genresSet = new Set(['All']);
                trackedItems.forEach(item => { if (item.genres) item.genres.split(', ').forEach(g => genresSet.add(g)); });
                return Array.from(genresSet).sort((a, b) => {
                    if (a === 'All') return -1;
                    if (b === 'All') return 1;
                    return a.localeCompare(b);
                });
            }, [trackedItems]);

            const filteredLibraryItems = useMemo(() => {
                return trackedItems.filter(item => {
                    const typeMatch = libraryTypeFilter === 'All' || item.media_type === libraryTypeFilter;
                    const statusMatch = libraryFilter === 'All' || item.status === libraryFilter || (libraryFilter === 'Finished' && item.status === 'Watched');
                    const genreMatch = libraryGenreFilter === 'All' || (item.genres && item.genres.includes(libraryGenreFilter));
                    return typeMatch && statusMatch && genreMatch;
                });
            }, [trackedItems, libraryFilter, libraryTypeFilter, libraryGenreFilter]);

            useEffect(() => {
                if (activeTab === 'BOARD' && comingSoonItems.length > 0 && !selectedItem && !selectedPerson && !selectedEpisode) {
                    const timer = setInterval(() => setCurrentHeroIndex(prev => (prev + 1) % comingSoonItems.length), 5000);
                    return () => clearInterval(timer);
                }
            }, [activeTab, comingSoonItems.length, selectedItem, selectedPerson, selectedEpisode]);

            useEffect(() => {
                const handleScroll = () => {
                    if (selectedItem || selectedPerson || selectedEpisode || activeTab === 'FAVORITES' || activeTab === 'LIBRARY') return; 
                    if (window.innerHeight + document.documentElement.scrollTop + 100 >= document.documentElement.offsetHeight) {
                        if (!isLoading && (['MOVIES', 'SERIES', 'NEW', 'SEARCH'].includes(activeTab))) setPage((prevPage) => prevPage + 1);
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, [isLoading, activeTab, selectedItem, selectedPerson, selectedEpisode]);

            useEffect(() => {
                if (!selectedItem) { setDetailsData(null); setIsTrackMenuOpen(false); return; }
                const fetchDetails = async () => {
                    setIsDetailsLoading(true);
                    try {
                        const url = `${TMDB_BASE_URL}/${selectedItem.type}/${selectedItem.id}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos`;
                        const res = await fetch(url);
                        setDetailsData(await res.json());
                    } catch (err) {} finally { setIsDetailsLoading(false); }
                };
                fetchDetails();
            }, [selectedItem]);

            useEffect(() => {
                if (!selectedPerson) { setPersonData(null); return; }
                const fetchPerson = async () => {
                    setIsPersonLoading(true);
                    try {
                        const url = `${TMDB_BASE_URL}/person/${selectedPerson}?api_key=${TMDB_API_KEY}&append_to_response=combined_credits`;
                        const res = await fetch(url);
                        setPersonData(await res.json());
                    } catch (err) {} finally { setIsPersonLoading(false); }
                };
                fetchPerson();
            }, [selectedPerson]);

            useEffect(() => {
                if (activeTab !== 'BOARD') return;

                const fetchBoardData = async () => {
                    setIsTrendingLoading(true); setIsBoardNewLoading(true); setIsSectionsLoading(true);
                    try {
                        const genreMap = { 'Action': { m: 28, t: 10759 }, 'Comedy': { m: 35, t: 35 }, 'Historical': { m: 36, t: null }, 'Drama': { m: 18, t: 18 }, 'Sci fi': { m: 878, t: 10765 }, 'Fantasy': { m: 14, t: 10765 }, 'Musical': { m: 10402, t: null }, 'Documentary': { m: 99, t: 99 } };
                        let trendingUrl = boardGenre && genreMap[boardGenre]?.m ? `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genreMap[boardGenre].m}&sort_by=popularity.desc` : `${TMDB_BASE_URL}/trending/all/week?api_key=${TMDB_API_KEY}`;
                        const today = new Date().toISOString().split('T')[0];
                        let newUrl = `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&sort_by=primary_release_date.desc&primary_release_date.lte=${today}&vote_count.gte=5&with_origin_country=US`;
                        if (boardGenre && genreMap[boardGenre]?.m) newUrl += `&with_genres=${genreMap[boardGenre].m}`;
                        let popMovieUrl = boardGenre && genreMap[boardGenre]?.m ? `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genreMap[boardGenre].m}&sort_by=popularity.desc` : `${TMDB_BASE_URL}/movie/popular?api_key=${TMDB_API_KEY}&language=en-US&page=1`;
                        let popTvUrl = boardGenre && genreMap[boardGenre]?.t ? `${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&with_genres=${genreMap[boardGenre].t}&sort_by=popularity.desc` : `${TMDB_BASE_URL}/tv/popular?api_key=${TMDB_API_KEY}&language=en-US&page=1`;
                        let topRatedUrl = boardGenre && genreMap[boardGenre]?.m ? `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genreMap[boardGenre].m}&sort_by=vote_average.desc&vote_count.gte=1000` : `${TMDB_BASE_URL}/movie/top_rated?api_key=${TMDB_API_KEY}&language=en-US&page=1`;

                        const [trendRes, newRes, popMRes, popTvRes, topRes] = await Promise.all([fetch(trendingUrl), fetch(newUrl), fetch(popMovieUrl), fetch(popTvUrl), fetch(topRatedUrl)]);
                        const mapper = (i, type) => ({ id: i.id, type: type || i.media_type || (i.name ? 'tv' : 'movie'), title: i.title || i.name, rating: i.vote_average?.toFixed(1) || 'N/A', comments: Math.floor(Math.random()*100), image: `https://image.tmdb.org/t/p/w500${i.poster_path}` });
                        const [tD, nD, pMD, pTD, trD] = await Promise.all([trendRes.json(), newRes.json(), popMRes.json(), popTvRes.json(), topRes.json()]);

                        setTrendingItems(tD.results?.filter(i => i.poster_path).slice(0, 15).map(i => mapper(i)) || []);
                        setBoardNewItems(nD.results?.filter(i => i.poster_path).slice(0, 15).map(i => mapper(i, 'movie')) || []);
                        setPopularMovies(pMD.results?.filter(i => i.poster_path).slice(0, 15).map(i => mapper(i, 'movie')) || []);
                        setPopularTV(pTD.results?.filter(i => i.poster_path).slice(0, 15).map(i => mapper(i, 'tv')) || []);
                        setTopRated(trD.results?.filter(i => i.poster_path).slice(0, 15).map(i => mapper(i, 'movie')) || []);
                    } catch (err) {} finally { setIsTrendingLoading(false); setIsBoardNewLoading(false); setIsSectionsLoading(false); }
                };

                const fetchComingSoon = async () => {
                    setIsComingSoonLoading(true);
                    try {
                        const today = new Date().toISOString().split('T')[0];
                        const res = await fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&sort_by=popularity.desc&primary_release_date.gte=${today}&with_origin_country=US`);
                        const data = await res.json();
                        setComingSoonItems(data.results.filter(i => i.poster_path).slice(0, 15).map(i => ({
                            id: i.id, type: 'movie', title: i.title, rating: i.vote_average?.toFixed(1) || 'N/A', viewers: Math.floor(Math.random()*500),
                            image: `https://image.tmdb.org/t/p/w500${i.poster_path}`, heroImage: `https://image.tmdb.org/t/p/original${i.backdrop_path || i.poster_path}`,
                            dateFormatted: new Date(i.release_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                        })));
                    } catch (err) {} finally { setIsComingSoonLoading(false); }
                };

                fetchBoardData(); fetchComingSoon();
            }, [activeTab, boardGenre]);

            useEffect(() => {
                if (activeTab === 'BOARD' || selectedItem || selectedPerson || selectedEpisode || activeTab === 'FAVORITES' || activeTab === 'LIBRARY') return;

                const fetchDynamicData = async () => {
                    setIsLoading(true);
                    try {
                        let newItems = [];
                        const effectivePage = page + randomPageOffset;

                        if (activeTab === 'NEW') {
                            const currentYear = new Date().getFullYear();
                            const dateGte = `${currentYear}-01-01`;
                            const dateLte = new Date().toISOString().split('T')[0];
                            const [mRes, tRes] = await Promise.all([
                                fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&sort_by=primary_release_date.desc&page=${page}&primary_release_date.gte=${dateGte}&primary_release_date.lte=${dateLte}&with_origin_country=US`),
                                fetch(`${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&sort_by=first_air_date.desc&page=${page}&first_air_date.gte=${dateGte}&first_air_date.lte=${dateLte}&with_origin_country=US`)
                            ]);
                            const mData = await mRes.json();
                            const tData = await tRes.json();
                            const combined = [...(mData.results || []), ...(tData.results || [])].filter(i => i.poster_path).sort((a, b) => new Date(b.release_date || b.first_air_date) - new Date(a.release_date || a.first_air_date)).slice(0, 10);
                            newItems = combined.map(i => ({ id: `${i.id}-${page}`, type: i.name ? 'tv' : 'movie', name: i.title || i.name, rating: { average: i.vote_average?.toFixed(1) || 'N/A' }, image: { medium: `https://image.tmdb.org/t/p/w500${i.poster_path}` } }));
                        } else {
                            let url = '';
                            if (activeTab === 'MOVIES') {
                                url = `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&sort_by=popularity.desc&page=${effectivePage}`;
                                if (filterYear) url += `&primary_release_year=${filterYear}`;
                                if (filterGenre) url += `&with_genres=${GENRE_MAP_MOVIE[filterGenre]}`;
                                if (filterCountry) url += `&with_origin_country=${COUNTRY_MAP[filterCountry]}`;
                            } else if (activeTab === 'SERIES') {
                                url = `${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&sort_by=popularity.desc&page=${effectivePage}`;
                                if (filterYear) url += `&first_air_date_year=${filterYear}`;
                                if (filterGenre) url += `&with_genres=${GENRE_MAP_TV[filterGenre]}`;
                                if (filterCountry) url += `&with_origin_country=${COUNTRY_MAP[filterCountry]}`;
                            } else if (activeTab === 'SEARCH') {
                                url = `${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(searchQuery)}&page=${page}`;
                            }

                            if (url) {
                                const res = await fetch(url);
                                const data = await res.json();
                                newItems = (data.results || []).filter(i => i.poster_path && i.media_type !== 'person').map(i => ({
                                    id: `${i.id}-${page}`, type: i.media_type || (i.name ? 'tv' : 'movie'), name: i.title || i.name, rating: { average: i.vote_average?.toFixed(1) || 'N/A' }, image: { medium: `https://image.tmdb.org/t/p/w500${i.poster_path}` }
                                }));
                            }
                            if (newItems.length === 0 && effectivePage > 1 && page === 1) { setRandomPageOffset(0); return; }
                        }
                        setFetchedShows(prev => page === 1 ? newItems : [...prev, ...newItems]);
                    } catch (err) {} finally { setIsLoading(false); }
                };
                fetchDynamicData();
            }, [activeTab, page, filterYear, filterGenre, filterCountry, searchQuery, selectedItem, selectedPerson, randomPageOffset]);

            const scrollCast = (direction) => {
                if (castScrollRef.current) castScrollRef.current.scrollBy({ left: direction === 'left' ? -300 : 300, behavior: 'smooth' });
            };

            const isFavorited = (id, type) => favorites.some(fav => Number(fav.media_id) === Number(id) && fav.media_type === type);

            const sortedActorCredits = useMemo(() => {
                if (!personData || !personData.combined_credits || !personData.combined_credits.cast) return [];
                const baseCast = personData.combined_credits.cast.filter(item => {
                    const excludedGenres = [10767, 10763, 10764];
                    const characterName = (item.character || "").toLowerCase();
                    return item.poster_path && !item.genre_ids?.some(id => excludedGenres.includes(id)) && !characterName.includes("self") && !characterName.includes("himself") && !characterName.includes("herself");
                });
                if (actorSort === 'popularity') return [...baseCast].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
                return [...baseCast].sort((a, b) => {
                    const timeA = new Date(a.release_date || a.first_air_date || '').getTime() || 0;
                    const timeB = new Date(b.release_date || b.first_air_date || '').getTime() || 0;
                    return actorSort === 'newest' ? (timeB - timeA) : (timeA - timeB);
                });
            }, [personData, actorSort]);

            const { tvTotalEpisodes, tvWatchedEpisodes, tvWatchedCount, tvProgressPercent, tvNextEpisode } = useMemo(() => {
                if (!detailsData || selectedItem?.type !== 'tv') return { tvTotalEpisodes: 0, tvWatchedEpisodes: {}, tvWatchedCount: 0, tvProgressPercent: 0, tvNextEpisode: 'N/A' };
                const regularSeasons = detailsData.seasons?.filter(s => s.season_number > 0) || [];
                const totalEpisodes = regularSeasons.reduce((acc, s) => acc + (s.episode_count || 0), 0);
                const trackedItem = trackedItems.find(t => Number(t.media_id) === Number(selectedItem.id) && t.media_type === 'tv');
                const { watched_episodes } = getTvProgress(trackedItem);

                let nextEpStr = 'All Caught Up!';
                let foundNext = false;
                for (const s of [...regularSeasons].sort((a, b) => a.season_number - b.season_number)) {
                    for (let ep = 1; ep <= s.episode_count; ep++) {
                        if (!watched_episodes[`${s.season_number}_${ep}`]) {
                            nextEpStr = `S${String(s.season_number).padStart(2, '0')}E${String(ep).padStart(2, '0')}`;
                            foundNext = true; break;
                        }
                    }
                    if (foundNext) break;
                }

                const watchedCount = Object.keys(watched_episodes).filter(k => watched_episodes[k] === true).length;
                return { tvTotalEpisodes: totalEpisodes, tvWatchedEpisodes: watched_episodes, tvWatchedCount: watchedCount, tvProgressPercent: totalEpisodes > 0 ? Math.round((watchedCount / totalEpisodes) * 100) : 0, tvNextEpisode: nextEpStr };
            }, [detailsData, selectedItem, trackedItems]);

            const toggleSeasonExpand = async (seasonNum) => {
                const isOpening = !expandedSeasons[seasonNum];
                setExpandedSeasons(prev => ({ ...prev, [seasonNum]: isOpening }));
                if (isOpening && !seasonEpisodesMap[seasonNum]) {
                    try {
                        const url = `${TMDB_BASE_URL}/tv/${selectedItem.id}/season/${seasonNum}?api_key=${TMDB_API_KEY}`;
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            setSeasonEpisodesMap(prev => ({ ...prev, [seasonNum]: data.episodes || [] }));
                        }
                    } catch (e) {}
                }
            };

            const toggleEpisodeWatched = (seasonNum, episodeNum) => {
                const updatedWatched = { ...tvWatchedEpisodes, [`${seasonNum}_${episodeNum}`]: !tvWatchedEpisodes[`${seasonNum}_${episodeNum}`] };
                updateTvProgress(selectedItem.id, updatedWatched, tvTotalEpisodes);
            };

            const markSeasonWatched = (seasonNum, episodeCount, forceValue = true) => {
                const updatedWatched = { ...tvWatchedEpisodes };
                for (let ep = 1; ep <= episodeCount; ep++) {
                    if (forceValue) updatedWatched[`${seasonNum}_${ep}`] = true;
                    else delete updatedWatched[`${seasonNum}_${ep}`];
                }
                updateTvProgress(selectedItem.id, updatedWatched, tvTotalEpisodes);
            };

            const markAllWatched = (forceValue = true) => {
                const updatedWatched = forceValue ? { ...tvWatchedEpisodes } : {};
                if (forceValue && detailsData?.seasons) {
                    detailsData.seasons.filter(s => s.season_number > 0).forEach(s => {
                        for (let ep = 1; ep <= s.episode_count; ep++) updatedWatched[`${s.season_number}_${ep}`] = true;
                    });
                }
                updateTvProgress(selectedItem.id, updatedWatched, tvTotalEpisodes);
            };

            return (
                <div className="min-h-screen pb-[calc(env(safe-area-inset-bottom)+70px)] md:pb-20 overflow-x-hidden">
                    <header className="sticky top-0 z-[100] flex h-auto md:h-20 flex-col md:flex-row items-center justify-between px-4 md:px-8 py-3 md:py-0 bg-white/40 backdrop-blur-md border-b border-white/20">
                        <div className="flex w-full md:w-auto items-center justify-between mb-0 md:mb-0">
                            <div className="flex flex-col items-center justify-center pt-1 cursor-pointer" onClick={() => handleTabChange('BOARD')}>
                                <span className="text-xs md:text-sm font-black tracking-[0.3em] leading-none">M O V I E</span>
                                <span className="text-[8px] md:text-[10px] font-bold tracking-[0.15em] leading-tight text-gray-800">G A T H E R</span>
                            </div>
                            
                            <div onClick={() => handleTabChange('FAVORITES')} className="relative cursor-pointer md:hidden flex items-center gap-2">
                                <div className="h-9 w-9 rounded-xl bg-black flex items-center justify-center border-2 border-white shadow-sm transition-transform">
                                    <span className="text-white font-black text-base select-none">M</span>
                                </div>
                                {favorites.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-4 h-4 flex items-center justify-center rounded-full border border-white shadow-sm">
                                        {favorites.length}
                                    </span>
                                )}
                            </div>
                        </div>

                        <nav className="hidden md:flex w-full md:w-auto space-x-4 md:space-x-10 pb-2 md:pb-0 justify-center">
                            {['BOARD', 'NEW', 'MOVIES', 'SERIES', 'LIBRARY'].map((tab) => (
                                <button key={tab} onClick={() => handleTabChange(tab)} className={`relative py-1 md:py-2 text-[10px] md:text-xs font-extrabold tracking-widest uppercase transition-colors shrink-0 ${activeTab === tab ? 'text-black' : 'text-gray-500 hover:text-black'}`}>
                                    {tab}{activeTab === tab && <div className="absolute bottom-0 left-0 right-0 h-[2px] md:h-[3px] bg-black rounded-t-sm" />}
                                </button>
                            ))}
                        </nav>

                        <div className="hidden md:flex items-center space-x-6">
                            <div className="relative">
                                <input type="text" placeholder="Search..." value={searchInput} onChange={(e) => setSearchInput(e.target.value)} onKeyDown={handleSearch} className="h-10 w-48 lg:w-64 rounded-full border border-gray-300 bg-white/60 px-5 text-sm outline-none focus:bg-white shadow-sm focus:shadow-md transition-all" />
                                <Icon name="Search" onClick={handleSearch} className="absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-black cursor-pointer" />
                            </div>
                            <div onClick={() => handleTabChange('FAVORITES')} className="relative cursor-pointer group flex items-center gap-2">
                                <div className="h-10 w-10 rounded-xl bg-black flex items-center justify-center border-2 border-white shadow-sm transition-transform group-hover:scale-110 overflow-hidden">
                                    <span className="text-white font-black text-lg select-none">M</span>
                                </div>
                                {favorites.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white shadow-sm animate-in zoom-in-300">
                                        {favorites.length}
                                    </span>
                                )}
                            </div>
                        </div>

                        {activeTab !== 'LIBRARY' && (
                            <div className="flex md:hidden w-full mt-3 relative">
                                <input type="text" placeholder="Search..." value={searchInput} onChange={(e) => setSearchInput(e.target.value)} onKeyDown={handleSearch} className="h-10 w-full rounded-full border border-gray-300 bg-white/60 px-5 pr-12 text-sm outline-none focus:bg-white shadow-sm transition-all" />
                                <Icon name="Search" onClick={handleSearch} className="absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-black" />
                            </div>
                        )}
                    </header>

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200 z-[110] pb-[env(safe-area-inset-bottom)]">
                        <div className="flex justify-around items-center h-[60px] px-2">
                            {[{ id: 'BOARD', label: 'Board', icon: 'LayoutGrid' }, { id: 'NEW', label: 'New', icon: 'Sparkles' }, { id: 'MOVIES', label: 'Movies', icon: 'Film' }, { id: 'SERIES', label: 'Series', icon: 'Tv' }, { id: 'LIBRARY', label: 'Library', icon: 'Bookmark' }].map((tab) => {
                                const isActive = activeTab === tab.id;
                                return (
                                    <button key={tab.id} onClick={() => handleTabChange(tab.id)} className={`flex flex-col items-center justify-center w-16 h-full space-y-1 transition-colors ${isActive ? 'text-black' : 'text-gray-400'}`}>
                                        <div className="relative">
                                            <Icon name={tab.icon} className={`h-[22px] w-[22px] ${isActive ? 'stroke-[2.5]' : 'stroke-2'}`} />
                                            {isActive && <div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 bg-black rounded-full" />}
                                        </div>
                                        <span className="text-[9px] font-bold tracking-wide">{tab.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <main className="mx-auto max-w-[1500px] px-4 md:px-8 py-4 md:py-8">
                        {selectedPerson ? (
                            <div className="animate-in fade-in duration-500">
                                {isPersonLoading || !personData ? (
                                    <div className="flex h-[60vh] items-center justify-center"><div className="h-12 w-12 animate-spin rounded-full border-4 border-gray-300 border-t-black"></div></div>
                                ) : (
                                    <div className="flex flex-col gap-6 md:gap-10">
                                        <button onClick={() => window.history.back()} className="flex w-max items-center space-x-2 rounded-full bg-white px-4 py-2 text-sm font-bold shadow-sm border border-gray-200"><Icon name="ArrowLeft" /> <span>Back</span></button>
                                        <div className="flex flex-col md:flex-row gap-8 md:gap-12">
                                            <div className="w-full md:w-[350px] shrink-0 text-center md:text-left">
                                                <img src={personData.profile_path ? `https://image.tmdb.org/t/p/h632${personData.profile_path}` : 'https://via.placeholder.com/350x525'} className="w-full max-w-[280px] md:max-w-full mx-auto rounded-[2rem] shadow-2xl mb-8" />
                                                <h3 className="text-xl font-black mb-4">Bio Info</h3>
                                                <div className="grid grid-cols-2 md:grid-cols-1 gap-4 text-left">
                                                    <div><p className="text-[10px] font-bold text-gray-500 uppercase">Known For</p><p className="text-sm font-semibold">{personData.known_for_department}</p></div>
                                                    <div><p className="text-[10px] font-bold text-gray-500 uppercase">Birthday</p><p className="text-sm font-semibold">{personData.birthday || 'N/A'}</p></div>
                                                    <div className="col-span-2 md:col-span-1"><p className="text-[10px] font-bold text-gray-500 uppercase">Place of Birth</p><p className="text-sm font-semibold">{personData.place_of_birth || 'N/A'}</p></div>
                                                </div>
                                            </div>
                                            <div className="flex-1">
                                                <h1 className="text-3xl md:text-6xl font-black mb-4 md:mb-6 tracking-tighter">{personData.name}</h1>
                                                <h2 className="text-xl md:text-2xl font-black mb-4">Biography</h2>
                                                <p className="text-base md:text-lg text-gray-600 mb-8 md:mb-12 leading-relaxed">{personData.biography || "No biography available."}</p>
                                                
                                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 md:mb-8 border-b border-gray-200/60 pb-4">
                                                    <h2 className="text-xl md:text-2xl font-black">Acting Roles</h2>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs font-bold text-gray-500 uppercase">Sort by:</span>
                                                        <select value={actorSort} onChange={(e) => setActorSort(e.target.value)} className="h-9 px-3 rounded-full border border-gray-300 bg-white text-xs font-bold outline-none cursor-pointer focus:border-black transition-colors">
                                                            <option value="popularity">Most Popular</option><option value="newest">Newest → Oldest</option><option value="oldest">Oldest → Newest</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6">
                                                    {sortedActorCredits.slice(0, 50).map((item, idx) => (
                                                        <div key={idx} onClick={() => openDetails(item.id, item.media_type)} className="cursor-pointer group">
                                                            <div className="aspect-[2/3] rounded-2xl overflow-hidden shadow-sm mb-2 md:mb-3 relative">
                                                                <img src={`https://image.tmdb.org/t/p/w500${item.poster_path}`} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                                <span className="absolute bottom-2 right-2 rounded-full bg-black/75 px-2 py-0.5 text-[8px] font-black uppercase text-white tracking-widest border border-white/10">{item.media_type === 'movie' ? 'Movie' : 'TV'}</span>
                                                            </div>
                                                            <div className="flex items-center justify-between gap-1 mb-0.5">
                                                                <span className="text-[10px] font-extrabold text-blue-600">★ {(item.vote_average || 0).toFixed(1)}</span>
                                                                {(item.release_date || item.first_air_date) && <span className="text-[10px] font-bold text-gray-400">{(item.release_date || item.first_air_date).split('-')[0]}</span>}
                                                            </div>
                                                            <h4 className="text-xs font-bold truncate group-hover:text-blue-600 transition-colors">{item.title || item.name}</h4>
                                                            {item.character && <p className="text-[10px] text-gray-500 font-medium truncate italic mt-0.5">as {item.character}</p>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : selectedItem ? (
                            <React.Fragment>
                                {selectedEpisode && (
                                    <div className="md:hidden animate-in fade-in slide-in-from-right-4 duration-300">
                                        <MobileEpisodeDetailsView 
                                            showId={selectedItem.id} seasonNum={selectedEpisode.season} episodeNum={selectedEpisode.episode}
                                            goBack={() => window.history.back()} navigateToState={navigateToState}
                                            trackedItems={trackedItems} updateTvProgress={updateTvProgress}
                                        />
                                    </div>
                                )}

                                <div className={`animate-in fade-in duration-500 ${selectedEpisode ? 'hidden md:block' : 'block'}`}>
                                    {isDetailsLoading || !detailsData ? (
                                        <div className="flex h-[60vh] items-center justify-center"><div className="h-12 w-12 animate-spin rounded-full border-4 border-gray-300 border-t-black"></div></div>
                                    ) : (
                                        <div className="flex flex-col gap-6 md:gap-10">
                                            <div className="flex flex-wrap justify-between items-center gap-4">
                                                <button onClick={() => window.history.back()} className="flex w-max items-center space-x-2 rounded-full bg-white px-4 py-2 text-sm font-bold shadow-sm border border-gray-200"><Icon name="ArrowLeft" /> <span>Back</span></button>
                                                <div className="flex items-center flex-wrap gap-2">
                                                    {trailerKey && <button onClick={() => setIsTrailerModalOpen(true)} className="flex items-center gap-2 rounded-full px-5 py-2 text-sm font-bold transition-all bg-red-600 hover:bg-red-700 text-white shadow-sm hover:scale-105 active:scale-95 animate-in slide-in-from-right-2 duration-300"><Icon name="Play" className="h-4 w-4 fill-white" /><span>Watch Trailer</span></button>}
                                                    <button 
                                                        disabled={isActionInProgress}
                                                        onClick={() => toggleFavorite({ id: selectedItem.id, type: selectedItem.type, title: detailsData.title || detailsData.name, poster_path: detailsData.poster_path, vote_average: detailsData.vote_average, genres: detailsData.genres })}
                                                        className={`flex items-center gap-2 rounded-full px-5 py-2 text-sm font-bold transition-all shadow-sm ${isActionInProgress ? 'opacity-50 cursor-not-allowed' : ''} ${isFavorited(selectedItem.id, selectedItem.type) ? 'bg-red-500 text-white' : 'bg-white text-gray-900 border border-gray-200 hover:bg-gray-50'}`}
                                                    ><Icon name="Heart" className={`h-4 w-4 ${isFavorited(selectedItem.id, selectedItem.type) ? 'fill-current' : ''}`} /><span>{isFavorited(selectedItem.id, selectedItem.type) ? 'Favorited' : 'Add Favorite'}</span></button>

                                                    <div className="track-menu-container relative">
                                                        <button onClick={() => setIsTrackMenuOpen(!isTrackMenuOpen)} className={`flex items-center gap-2 rounded-full px-5 py-2 text-sm font-bold transition-all shadow-sm ${getTrackingStatus(selectedItem.id, selectedItem.type) ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-white text-gray-900 border border-gray-200 hover:bg-gray-50'}`}>
                                                            <Icon name="Plus" className="h-4 w-4" /><span>{getTrackingStatus(selectedItem.id, selectedItem.type) || 'Track'}</span><Icon name="ChevronDown" className="h-3 w-3 ml-1 text-current opacity-80" />
                                                        </button>
                                                        {isTrackMenuOpen && (
                                                            <div className="absolute left-0 sm:left-auto right-auto sm:right-0 mt-2 w-48 rounded-2xl bg-white shadow-xl border border-gray-100 py-1.5 z-[120] animate-in fade-in slide-in-from-top-2 duration-200">
                                                                <p className="px-4 py-1.5 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-50 mb-1">Set Status</p>
                                                                {['Watching', 'Finished', 'Plan to Watch', 'On Hold', 'Dropped'].map((status) => (
                                                                    <button key={status} onClick={() => { handleTrackItem(selectedItem, status); setIsTrackMenuOpen(false); }} className={`w-full text-left px-4 py-2.5 text-xs font-semibold transition-colors flex items-center justify-between ${getTrackingStatus(selectedItem.id, selectedItem.type) === status ? 'bg-black text-white' : 'text-gray-700 hover:bg-gray-50'}`}>
                                                                        <span>{status}</span>
                                                                        {getTrackingStatus(selectedItem.id, selectedItem.type) === status && <Icon name="Check" className="h-3.5 w-3.5" />}
                                                                    </button>

                                                        return <LibraryTvCard key={`${item.media_id}-${item.media_type}`} item={item} openDetails={openDetails} handleRemoveTracking={handleRemoveTracking} handleTrackItem={handleTrackItem} updateTvProgress={updateTvProgress} openEpisodeDetails={openEpisodeDetails} />;
                                                    } else {
                                                        return <LibraryMovieCard key={`${item.media_id}-${item.media_type}`} item={item} openDetails={openDetails} handleRemoveTracking={handleRemoveTracking} handleTrackItem={handleTrackItem} />;
                                                    }
                                                })}
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        ) : activeTab === 'BOARD' ? (
                            <>
                                <div className="flex flex-col lg:flex-row gap-6 md:gap-8 mb-8 lg:h-[400px]">
                                    <div className="group relative w-full lg:flex-1 h-[300px] md:h-[400px] lg:h-full overflow-hidden rounded-[2rem] md:rounded-[2.5rem] shadow-xl shadow-gray-300/50 bg-black">
                                        {comingSoonItems.length > 0 ? (
                                            <div className="relative h-full w-full">
                                                <img key={comingSoonItems[currentHeroIndex].id} src={comingSoonItems[currentHeroIndex].heroImage} className="absolute inset-0 w-full h-full object-cover opacity-80" />
                                                <div className="absolute inset-0 bg-gradient-to-r from-black/90 to-transparent"></div>
                                                <div className="absolute inset-x-4 top-1/2 flex -translate-y-1/2 justify-between z-20 opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={(e) => { e.stopPropagation(); setCurrentHeroIndex(p => p === 0 ? comingSoonItems.length - 1 : p - 1); }} className="flex h-10 w-10 md:h-12 md:w-12 items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md border border-white/20"><Icon name="ChevronLeft" /></button>
                                                    <button onClick={(e) => { e.stopPropagation(); setCurrentHeroIndex(p => (p + 1) % comingSoonItems.length); }} className="flex h-10 w-10 md:h-12 md:w-12 items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md border border-white/20"><Icon name="ChevronRight" /></button>
                                                </div>
                                                <div className="absolute bottom-6 md:bottom-12 left-6 md:left-12 text-white z-20 cursor-pointer pr-6" onClick={() => openDetails(comingSoonItems[currentHeroIndex].id, 'movie')}>
                                                    <p className="text-[8px] md:text-xs font-bold mb-2 md:mb-3 uppercase tracking-widest bg-white/10 w-max px-2 py-0.5 md:px-3 md:py-1 rounded-full">Releasing {comingSoonItems[currentHeroIndex].dateFormatted}</p>
                                                    <h1 className="text-2xl md:text-5xl font-black mb-2 md:mb-5 leading-tight line-clamp-2">{comingSoonItems[currentHeroIndex].title}</h1>
                                                    <div className="flex items-center gap-4 text-[10px] md:text-xs font-bold">
                                                        <span className="flex items-center gap-1">★ {comingSoonItems[currentHeroIndex].rating}</span>
                                                        <span className="flex items-center gap-1">👥 {comingSoonItems[currentHeroIndex].viewers} Anticipating</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : <div className="animate-pulse bg-gray-800 w-full h-full"></div>}
                                    </div>
                                    <div className="w-full lg:w-[340px] flex flex-col">
                                        <h2 className="text-lg md:text-xl font-bold mb-4 md:mb-5 tracking-tight">Coming soon</h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">
                                            {comingSoonItems.slice(0, 3).map(item => (
                                                <div key={item.id} onClick={() => openDetails(item.id, item.type)} className="flex items-center gap-4 p-2 bg-white/40 rounded-2xl hover:bg-white/70 cursor-pointer transition-colors backdrop-blur-sm border border-white/20">
                                                    <img src={item.image} className="w-[100px] md:w-[110px] h-[64px] md:h-[72px] rounded-xl object-cover" />
                                                    <div className="overflow-hidden">
                                                        <h3 className="font-bold truncate text-sm md:text-[15px]">{item.title}</h3>
                                                        <p className="text-[10px] text-gray-500 font-bold">{item.dateFormatted}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-8 md:mb-10 flex items-center">
                                    <span className="hidden md:block mr-6 w-16 text-sm font-extrabold leading-tight">Find by genre</span>
                                    <div className="flex flex-1 gap-2.5 overflow-x-auto no-scrollbar py-2">
                                        {GENRES_BOARD.map(g => (
                                            <button key={g.name} onClick={() => navigateToState({ boardGenre: boardGenre === g.name ? '' : g.name })} className={`flex shrink-0 items-center gap-2 px-5 py-2 md:py-2.5 rounded-full font-bold text-[10px] md:text-sm shadow-sm transition-all border ${boardGenre === g.name ? 'bg-black text-white' : 'bg-white/70 hover:bg-white'}`}>
                                                <Icon name={g.icon} /> {g.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                
                                <Section title={boardGenre ? `Trending ${boardGenre}` : "Trending Now"} items={trendingItems} onSelect={openDetails} isLoading={isTrendingLoading} />
                                <Section title={boardGenre ? `New ${boardGenre}` : "New Releases"} items={boardNewItems} onSelect={openDetails} isLoading={isBoardNewLoading} />
                                
                                <Section title="Popular Movies" items={popularMovies} onSelect={openDetails} isLoading={isSectionsLoading} />
                                <Section title="Popular TV Shows" items={popularTV} onSelect={openDetails} isLoading={isSectionsLoading} />
                                <Section title="Top Rated" items={topRated} onSelect={openDetails} isLoading={isSectionsLoading} />
                            </>
                        ) : (
                            <div className="animate-in fade-in duration-500">
                                <h1 className="text-2xl md:text-3xl font-black mb-6 md:mb-8 capitalize">{activeTab.toLowerCase()} Collection</h1>
                                {['MOVIES', 'SERIES'].includes(activeTab) && (
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">
                                        <select value={filterGenre} onChange={e => navigateToState({ filterGenre: e.target.value, page: 1, fetchedShows: [] })} className="h-10 px-4 rounded-full border border-gray-300 bg-white/60 text-xs md:text-sm font-semibold outline-none focus:bg-white">
                                            <option value="">All Genres</option>
                                            {Object.keys(activeTab === 'SERIES' ? GENRE_MAP_TV : GENRE_MAP_MOVIE).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={filterYear} onChange={e => navigateToState({ filterYear: e.target.value, page: 1, fetchedShows: [] })} className="h-10 px-4 rounded-full border border-gray-300 bg-white/60 text-xs md:text-sm font-semibold outline-none focus:bg-white">
                                            <option value="">All Years</option>
                                            {[2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013].map(y => <option key={y} value={y}>{y}</option>)}
                                        </select>
                                        <select value={filterCountry} onChange={e => navigateToState({ filterCountry: e.target.value, page: 1, fetchedShows: [] })} className="h-10 px-4 rounded-full border border-gray-300 bg-white/60 text-xs md:text-sm font-semibold outline-none focus:bg-white">
                                            <option value="">All Countries</option>
                                            {Object.keys(COUNTRY_MAP).map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                )}
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 gap-4 md:gap-6">
                                    {fetchedShows.map(show => (
                                        <div key={show.id} onClick={() => openDetails(show.id, show.type)} className="cursor-pointer group">
                                            <div className="aspect-[2/3] rounded-2xl overflow-hidden shadow-sm mb-2 md:mb-3">
                                                <img src={show.image.medium} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            </div>
                                            <p className="text-[10px] md:text-[11px] font-bold text-gray-500 mb-0.5 md:mb-1">★ {show.rating.average} TMDb</p>
                                            <h3 className="text-xs md:text-sm font-bold truncate">{show.name}</h3>
                                        </div>
                                    ))}
                                </div>
                                {isLoading && <div className="py-10 text-center flex justify-center"><div className="w-8 h-8 border-4 border-gray-300 border-t-black rounded-full animate-spin"></div></div>}
                            </div>
                        )}
                    </main>

                    {isTrailerModalOpen && trailerKey && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/95 p-4 transition-opacity duration-300 animate-in fade-in" onClick={() => setIsTrailerModalOpen(false)}>
                            <div className="relative w-full max-w-4xl aspect-video rounded-3xl overflow-hidden bg-black shadow-2xl border border-white/15 animate-in zoom-in-95 duration-300" onClick={(e) => e.stopPropagation()}>
                                <div className="absolute top-4 left-4 z-50 flex gap-2">
                                    <a href={`https://www.youtube.com/watch?v=${trailerKey}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-black rounded-full bg-red-600 hover:bg-red-700 text-white shadow-lg transition-transform active:scale-95 border border-red-500/10"><Icon name="ExternalLink" className="h-3.5 w-3.5" /><span>Watch on YouTube</span></a>
                                </div>
                                <button onClick={() => setIsTrailerModalOpen(false)} className="absolute top-4 right-4 z-50 p-2 rounded-full bg-black/50 text-white hover:bg-black/85 transition-colors border border-white/10 focus:outline-none"><Icon name="X" className="h-5 w-5" /></button>
                                <iframe src={computedTrailerEmbedUrl} title="Official Trailer Player" className="w-full h-full border-0 bg-black" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen></iframe>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
