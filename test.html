<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Embedder</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        input { 
            width: 70%; 
            padding: 10px; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            padding: 10px 15px; 
            cursor: pointer; 
            background: #fe2c55; 
            color: white; 
            border: none; 
            border-radius: 4px;
        }
        #video-container { 
            margin-top: 20px; 
        }
        /* Style the iframe to look clean */
        iframe { 
            width: 100%; 
            height: 750px; 
            border: none; 
            border-radius: 12px; 
            background: #f8f8f8;
        }
    </style>
</head>
<body>

    <h2>Paste a TikTok Link</h2>
    <input type="text" id="tiktokUrl" placeholder="https://www.tiktok.com/@user/video/123456789..." />
    <button onclick="embedVideo()">Play Video</button>

    <div id="video-container"></div>

    <script>
        function embedVideo() {
            const urlInput = document.getElementById('tiktokUrl').value;
            const container = document.getElementById('video-container');
            
            // Clear any previous video or error message
            container.innerHTML = "";

            // Regular expression to extract the unique Video ID from the URL
            const match = urlInput.match(/video\/(\d+)/);

            if (match && match[1]) {
                const videoId = match[1];
                
                // Create the official TikTok iframe
                const iframe = document.createElement('iframe');
                
                // TikTok's official iframe player URL structure
                // Added parameters to show music info and description
                iframe.src = `https://www.tiktok.com/player/v1/${videoId}?music_info=1&description=1`; 
                iframe.allow = "fullscreen";
                
                // Add the iframe to the page
                container.appendChild(iframe);
            } else {
                // Handle invalid links gracefully
                container.innerHTML = "<p style='color:red;'>Invalid TikTok URL. Please make sure it is a full link containing the video ID.</p>";
            }
        }
    </script>
</body>
</html>
